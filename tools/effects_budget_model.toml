# Effects suite budget model (design suite §8) — the ONE machine-readable budget.
# The `code-derived` rows are gated by tools/effects_budget_check.py against the
# [symbols] table at the bottom of this file; the `fixed` rows are documentation with
# provenance; the NEEDS-MEASUREMENT rows are evidence gaps. There is deliberately no
# generator: the measured rows are upper bounds that include profiler instrumentation
# and exception entry (~2090 cyc/fire against a usable_cycles_after_entry of 60), so a
# generated `ensure` would fail programs that demonstrably run today (design spec §4.3).
#
# STATUS KEY:
#   fixed        = a hardware/architecture constant (datasheet or shipped-code derived)
#   code-derived = read from the shipped .emp (const or structural fact)
#   NEEDS-MEASUREMENT = only oracle profiling can give the real number; the value here
#                       is a placeholder/upper-estimate the controller replaces after the
#                       Task-4/5 oracle calibration. DO NOT treat as authoritative.
#
# Provenance for the fixed rows: docs/research/2026-08-12-raster-hint-survey.md.
#
# EVERY CYCLE ROW IN THIS FILE THAT CAME OFF ORACLE IS AN IDEAL-CYCLE FIGURE. Verified
# 2026-08-19 against oracle's own source: the 68000 core adds only `cyclesExecuted` to
# `_currentCycle` (M68000.cpp:1029-1031) while bus/VDP/DMA stall accumulates in
# `additionalTime` and lands in `_currentTime`; the profiler ring stamps `_currentCycle`
# (M68000.h:95). So stall time reaches the wall clock and never reaches a cycle row. That is
# why the code-derived model and the measured rows agree to the cycle — both count nominal
# 68000 instruction timings — and it is the reason max_contiguous_dma_stall_cycles below is
# recorded as UNMEASURABLE rather than as a number.

[engine_reservation]
# The standing engine cost a scene budget is measured AGAINST, not part of. Design §5: every
# axis budget is `pool - engine_reservation`. Two states, BOTH DEFINED IN
# docs/benchmarks/scanline-p2/ENGINE-BASELINE.md — a reservation whose camera state is not
# reproducible is not a reservation, which is how the effects-p3 baseline rows went stale.
#
# Scanline P2 Phase 0 Task 2, 2026-08-19. s4.debug.bin crc d22dda85. 31-frame sample, FIVE
# independent boots per state, SPREAD 0 on every row. tools/engine_baseline_probe.py.
status = "measured"
instrument = "ORACLE per-routine rows (oracle-next has no profiler); interrupts.hint is NEVER a valid source here -- it sums HBlank and VBlank. Cycle figures are IDEAL-CYCLE: the clock excludes bus/VDP/DMA stall (M68000.cpp:1029-1031)"

# THE DENOMINATOR PROBLEM, AND WHY THERE ARE TWO OF EVERY MAX-DIAGONAL ROW. Sustained
# max-diagonal does not run at 60 Hz. Measured on the engine's own counters (Frame_Counter vs
# Logic_Tick, the latter documented in engine/ram.emp as "lag-immune"): 31 video frames carry
# 15 logic ticks, i.e. 2.067 video frames per tick, spread 0 across five boots, with
# Lag_Frame_Count advancing 16. Idle runs 1.033. It is NOT the art soft-clamp -- Camera_Art_Hold
# reads 0 and DEBUG's Dbg_Cam_Clamp_Frames stays 0 for the whole run, both checked. The camera
# still advances CAM_MAX_STEP per TICK on both axes, which is the second, independent witness:
# camera_dx/16 == the Logic_Tick delta exactly.
#
# So a max-diagonal routine has two honest figures and both are here. The per-VIDEO-FRAME one
# is what the 128000-cycle budget divides; the per-LOGIC-TICK one is what one invocation of the
# work actually costs. Quoting only the first understates every routine by 2.07x.
frames_per_logic_tick_idle        = 1.033
frames_per_logic_tick_max_diagonal = 2.067

# The main-loop bracket: GameState_OJZScroll_Update, one call per logic tick.
idle_main_loop_cycles              = 35125    # per video frame
max_diagonal_main_loop_cycles      = 55144    # per video frame
idle_main_loop_cycles_per_tick     = 36296
max_diagonal_main_loop_cycles_per_tick = 113964

# The VBlank bracket: VInt_Level. Raster_VBlank runs INSIDE it, before Flush_VDP_Shadow and
# every DMA drain, so this is the number a VBlank axis is a fraction of -- not Raster_VBlank's
# own row. VInt_Lag is the spare VBlanks a lagging tick spends, listed beside it.
idle_vblank_cycles                 = 8280
max_diagonal_vblank_cycles         = 6117     # LOWER per video frame, because a lagging tick
                                              # spreads one VInt_Level over two VBlanks
idle_vblank_cycles_per_tick        = 8556
max_diagonal_vblank_cycles_per_tick = 12642
idle_vblank_lag_cycles             = 166
max_diagonal_vblank_lag_cycles     = 2904

# The five routines design §5 names, per VIDEO FRAME. Per-tick figures and the full 13-routine
# table (incl. Camera_Update, EntityWindow_Scan, Tile_Cache_Fill, Section_UpdateColumns and the
# VSync_Wait headroom) are in ENGINE-BASELINE.md.
idle_parallax_update_cycles        = 19511
max_diagonal_parallax_update_cycles = 12189
idle_raster_vblank_cycles          = 1482
max_diagonal_raster_vblank_cycles  = 1488
idle_palette_compose_cycles        = 145
max_diagonal_palette_compose_cycles = 67
idle_enqueue_dirty_buffers_cycles  = 1356
max_diagonal_enqueue_dirty_buffers_cycles = 1236
idle_bganim_update_cycles          = 181
max_diagonal_bganim_update_cycles  = 74

# THE HEADROOM, and the finding a budget parcel needs most. VSync_Wait is idle, not cost.
idle_vsync_wait_cycles             = 79595   # 62.2% of the frame is idle
max_diagonal_vsync_wait_cycles     = 34371   # 26.9% per video frame
# ...and yet max-diagonal LAGS, at 26.9% apparent idle. Both are true: a logic tick spans two
# video frames, so the tick's own work saturates the first and the wait lands in the second.
# Per tick the loop costs 113964 cycles against a 128000-cycle frame -- 89% -- and the VBlank
# bracket plus the lag handler are on top of that. The single biggest term is Tile_Cache_Fill at
# 106163 cyc/tick (40.1% of every video frame). ART STREAMING, NOT EFFECTS, IS WHAT SPENDS THE
# MAX-DIAGONAL FRAME: the five effects routines above total 22675 cyc/video-frame at idle
# (17.7%) and 15054 at max-diagonal (11.8%), against streaming's 40.1% -- and the effects total
# FALLS at max-diagonal only because it is being divided by twice as many video frames. Per
# LOGIC TICK the same five go 23430 -> 31111, which is the honest direction.
max_diagonal_lags = true
max_diagonal_lag_note = "sustained 16px/frame diagonal ticks at ~30 Hz, not 60. Measured, reproducible, spread 0. It is a streaming cost (Tile_Cache_Fill 40.1%), not an effects cost -- but every Phase-2 budget expressed per VIDEO FRAME must not assume 60 Hz at this state."

[dma_stall]
# AWARENESS ONLY — design §5 carries this NEEDS-MEASUREMENT for awareness, not gating, this
# phase, because it couples to the sound driver's DMA-survival design. Scanline P2 Phase 0
# Task 5, 2026-08-19.
#
# THE ASKED-FOR FIGURE IS UNMEASURABLE ON THIS INSTRUMENT, and that is the row's real content.
# Oracle's 68000 core adds only `cyclesExecuted` to `_currentCycle` (M68000.cpp:1029-1031)
# while bus/VDP/DMA stall accumulates in `additionalTime` and lands in `_currentTime`; the
# profiler ring stamps `_currentCycle` (M68000.h:95). Stall time therefore reaches the wall
# clock and NEVER reaches a cycle row. Any stall figure taken off a cycle row here would be an
# undercount or a zero regardless of what the hardware does -- which is why this row is not a
# number and must not be rendered as 0 or as green.
max_contiguous_dma_stall_cycles = "UNMEASURABLE-ON-THIS-INSTRUMENT"
max_contiguous_dma_stall_mechanism = "oracle's cycle clock excludes bus/VDP/DMA stall by construction: M68000.cpp:1029-1031 adds only cyclesExecuted to _currentCycle, additionalTime goes to _currentTime, and the profiler ring stamps _currentCycle (M68000.h:95)"
max_contiguous_dma_stall_migration = "oracle-next's profiler v1 rows carry stallCycles per routine (registered, in recon 2026-08-19). That is the direct read; re-take this row there."
max_contiguous_dma_stall_note = "couples to the sound driver's DMA-survival design; gating this is a later decision, not P2's"

# THE INDIRECT BOUND, and it is a DERIVATION rather than a measurement of a stall. The 68000 bus
# is held for the whole of a VDP DMA from 68K memory, so the longest contiguous hold in a frame
# is the longest SINGLE DMA the queue carries -- and that length IS readable, from SizeH/SizeL
# in each DMAEntry. tools/engine_baseline_probe.py scans the queue at scanline 220 (inside
# active display, after every main-loop enqueue, before VBlank drains it -- scanning at a frame
# boundary would read an empty queue and report "no stall").
#
# WHAT THE BOUND IS BLIND TO, so it is not over-read: refresh stalls, Z80 bus contention, VDP
# FIFO stalls on ordinary non-DMA port writes, and any DMA issued outside the queue. It bounds
# ONE contributor, and its cycle conversion uses documented hardware rates (H40 VBlank VRAM DMA
# 205 B/line, scanline 3420/7 = 488.57 cyc) rather than anything measured on this ROM.
dma_scan_status = "derived from queue contents, NOT a measured stall"
dma_scan_scanline = 220
dma_max_single_transfer_words = 576     # measured from the queue, 5 boots, identical at both states
dma_max_single_transfer_bytes = 1152
dma_max_single_transfer_derived_cycles = 2745.5   # 1152 B at 205 B/line x 488.57 cyc/line
dma_queue_entries_idle = 7
dma_queue_words_idle = 1528
dma_queue_words_max_diagonal = 1519
# The per-line HScroll buffers the plan prices at 896 B are visible in the scan as TWO 448-word
# entries (cmd 7C000082), confirming the axis-2 figure from the live queue rather than from the
# authoring side.
dma_hscroll_perline_entries = 2
dma_hscroll_perline_bytes_each = 896

[parallax.cost_model]
# THE WALKER'S FITTED ADDITIVE MODEL — design §5 axis 1. Scanline P2 Phase 0 Task 4,
# 2026-08-19. tools/parallax_cost_probe.py, 17 fixtures, 3 boots each, spread 0 on every one.
# Evidence + derivation: docs/benchmarks/scanline-p2/WALKER-MODEL.md.
#
# The response is `Parallax_Update`'s per-routine row, INCLUSIVE of its callees (verified:
# it contains Parallax_Fill_PerLine and Decode_Factor_A/B). Camera FROZEN, so every video
# frame carries exactly one complete call -- under motion the loop lags and a per-frame
# average stops being one call (ENGINE-BASELINE.md §2).
#
#   cycles = base
#          + band_percell x (bands - 1)          [per-cell mode]
#          + line_mode + band_perline x (bands-1) [per-line mode]
#          + multiband  (bands >= 2, once)
#          + line_fg_only x LINES + line_bg_only x LINES + line_both x LINES
#          + vdeform    (a V-deform table attached)
#          + anchor     (see the WARNING below -- NOT a constant)
#
# THE SAMPLING TERMS ARE PER SCREEN LINE, not per channel. That unit was forced by
# measurement, not chosen: fixtures that sample only their lower band (112 and 80 lines)
# give marginal costs of 8536/112 and 6097/80 against 17071/224 -- 76.21 every time. A
# per-channel constant fits the fixtures that sample everywhere and then over-charges real
# content, which samples only below an anchored split.
status = "measured"
instrument = "ORACLE per-routine row for Parallax_Update, inclusive; camera frozen; interrupts.hint never read. IDEAL-CYCLE (the clock excludes bus/VDP/DMA stall)"
fixtures = 17
residual_cycles = 0.27               # max |residual|, UN-ANCHORED subset (14 fixtures)
residual_cycles_all_fixtures = 195.9 # with the 3 anchored fixtures included -- see the warning
noise_floor_cycles = 0               # 3 boots per fixture, spread 0 on all 17

base_cycles          = 3021.94   # W0 — 1 band, per-cell, nothing on
band_percell_cycles  = 746.94    # W0->W1->W2->W3
line_mode_cycles     = 1518.02   # W0->W4: an H-deform table attached at all. Selects
                                 # Parallax_Fill_PerLine over _PerCell AND flips reg $0B.
band_perline_cycles  = 845.97    # W4->W5->W6
multiband_cycles     = 23.21     # ONCE, at bands >= 2, in BOTH modes. Step 4a's `.find_k`
                                 # probe loop: at band_count 1 the loop body never runs.
line_fg_only_cycles  = 76.21     # per screen line sampling the FG deform curve  (W7/W14/W15)
line_bg_only_cycles  = 76.27     # per screen line sampling the BG deform curve  (W13)
line_both_cycles     = 126.17    # per screen line sampling BOTH — NOT 152.5 (W8). The
                                 # per-line loop shares index and phase work across the
                                 # planes, so the second channel on a line costs 50, not 76.
vdeform_cycles       = 1424.06   # W0->W9: a V-deform table attached (per-column VSRAM)

# ANCHOR IS NOT A CONSTANT AND MUST NOT BE USED AS ONE. Measured cost of the Step-4b
# anchored overlay, over the un-anchored model, per fixture:
#     W10  2 bands, FG sampling on all 224 lines      +456.7
#     W12  3 bands, FG sampling on all 224 lines      +455.7
#     W16  4 bands, BG sampling on 144 lines BY the anchor  +1204.7
# The first two agree to 1 cycle and the third is 749 dearer. W16 is the SHIPPED shape
# (ParallaxConfig_OJZ_Underwater): its ROM bands all say 15 and the anchor is what switches
# the filler's loop type at the split, where W10/W12 merely re-write shifts their bands
# already carried. So the suspected missing parameter is a per-band cost that DIFFERS between
# a flat band and a sampling band -- collinear with band_perline in every un-anchored fixture,
# which is why nothing there could see it. NAMED, NOT FITTED: adding a column excited by one
# fixture would zero the residual without evidence.
anchor_cycles_reglue_only    = 456.2    # W10/W12 — the overlay when sampling is already on
anchor_cycles_shipped_shape  = 1204.7   # W16 — the overlay when it TURNS sampling on
anchor_status = "NOT CONSTANT — two regimes measured, missing parameter named in WALKER-MODEL.md, deliberately not fitted"

# OUT-OF-SAMPLE. The live config at the idle baseline is ParallaxConfig_OJZ_Underwater
# (4 bands, anchored at screen line 80, BG sampling on the 144 lines below it).
#   model (un-anchored terms + anchor_cycles_shipped_shape) = 19288.7
#   measured Parallax_Update at the idle baseline           = 19511
#   gap                                                     = +222.3  (1.1%)
# The residual gap is the shipped config's own band tops and scroll-factor shifts, which
# change the Decode_Factor_A/B work the fixtures hold constant. Recorded, not tuned away.
out_of_sample_predicted = 19288.7
out_of_sample_measured  = 19511
out_of_sample_gap_pct   = 1.1

