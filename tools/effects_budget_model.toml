# The cost model's own constants, gated against raster_dsl.emp by the [symbols] table below.
# Structure: fire_base ONCE per fire, then per op fetch + dispatch(depth) + class work +
# word slope x stream words + loop tail. Every constant confirmed twice — measured on oracle
# AND hand-counted off the emitted 68000 stream at s4.debug.bin $79CC..$7A5C.
#
# NOTE this table is code-derived and therefore GATED, unlike the measured rows above it.
# That is deliberate and it is the point of the parcel: the numbers a guard actually uses
# now have a machine-checked path back to the shipped code, so a constant cannot drift out
# from under this file the way `418 + 36x` did.
[raster.cost_model]
fire_base_cycles       = 280         # code-derived — RASTER_FIRE_BASE_CYC
op_fetch_cycles        = 8           # code-derived — move.w (a1)+, d1
dispatch_rung_cycles   = 16          # code-derived — a FAILED rung: cmpi.w + beq.s not taken
dispatch_hit_cycles    = 18          # code-derived — the matching rung: cmpi.w + beq.s taken
op_tail_cycles         = 10          # code-derived — dbf d0, .op_loop, taken
# SPLIT PER OP CLASS 2026-08-19 (substrate Tier-3 item 1). A burst word is `move.w` + the
# loop's taken `dbf` (10) in both cases; what differs is the destination spelling, which is
# decided by whether the op still holds VDP_CTRL in a2 when it reaches its burst.
stream_word_cram_cycles = 26         # code-derived — move.w (a1)+, -4(a2) 16 + dbf 10  (cram, vsram)
stream_word_deep_cycles = 30         # code-derived — move.w (a2)+, VDP_DATA 20 + dbf 10 (region, restore:
                                     #   a2 is their SOURCE cursor, so the write has no base register)
work_reg_cycles        = 12          # code-derived — move.w (a1)+, (a2)
# SPLIT 2026-08-18 (substrate item 1): the blanking spin is per-op DATA in the program,
# not a constant folded into these rows, so the work terms are now SPINLESS BASES and a
# fixture's work = base + spin_cyc(N) where spin_cyc(n) = n*10 + 14. The count read is
# `move.w (a1)+, d1` (8) where it was `moveq #imm, d1` (4), so each base is +4 on the
# spinless part of its predecessor.
work_cram_cycles_SUPERSEDED    = 90  # folded EFX_BLANK_DELAY=4's spin (54) into the constant
work_region_cycles_SUPERSEDED  = 122 # ditto, + lea 8 + adda.w 12 + lea restore 12
work_restore_cycles_SUPERSEDED = 212 # spinless 64 + EFX_RESTORE_DELAY=13 spin (148)
work_cram_base_cycles    = 40        # code-derived — cmd move.l 20 + spin read 8 + count 8 + tail dbf 4
work_region_base_cycles  = 72        # code-derived — the above + lea 8 + adda.w 12 + lea restore 12
work_restore_base_cycles = 72        # measured — R1's spinless 64 + the 4-cyc stream read
dispatch_rungs         = 5           # code-derived — chain length; OP_SET_REG falls through it
scanline_cycles        = 488         # code-derived — RASTER_SCANLINE_CYC
residual               = 0           # eight fixtures, four free parameters, zero residual
noise_floor_cycles     = 0           # five boots per fixture, spread 0 on all eight
