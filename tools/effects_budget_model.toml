# class, so it does not get the cram class's 4), streamed from a variant's Pal_Variant_Stage
# bytes. A full-line region spreads across ceil(16/3)=6 fires.
max_colours_per_fire = 3             # code-derived — bound by RASTER_BURST_MAX_DEEP
handler_extra_cycles = "NEEDS-MEASUREMENT"  # oracle: lea+adda.w+stream vs a plain OP_CRAM
# RENAMED 2026-08-14. This was `full_line_fire_cost`, which read as a CYCLE cost while
# being ceil(16/3) — a LINE COUNT — tagged `code-derived`, i.e. arithmetic wearing a
# measurement's label. It is how many fires a 16-colour line needs, nothing more.
full_line_fire_lines = 6             # code-derived — ceil(16 / 3)
# And the measured consequence: six of them CONSECUTIVELY is refused by the density
# guard, because a 3-colour cram fire is 518 cyc against a 488-cyc line. A full-line
# swap belongs in the dense tier, which stays inside one interrupt.
full_line_consecutive_verdict = "REFUSED — space them, or use the dense tier"

[raster.dense]
# OP_RUN_GRADIENT: fire every line (reg $0A=0), minimal per-line body.
mode = "every-line"
# MEASURED 2026-08-13 (oracle profiler, OJZ section 2, 96-line run = 101 fires/frame).
# Dense H-INT total 41579 cyc/frame (32.5%) vs sparse 8358 (6.5%); the marginal cost of
# the 97 extra fires is (41579-8358)/97 = ~342 cyc/line. That INCLUDES profiler
# instrumentation, autovector entry and rte, so it is an upper bound on the body.
#
# THE 8358 HERE IS DELIBERATE AND STILL VALID — do not "correct" it to the superseded
# marker at :41. Both 41579 and 8358 came off the SAME profiler on the SAME day under
# the SAME instrument bug (oracle's `interrupts.hint` bucket includes VBlank, because
# it classifies by comparing entry PC against $78 and Aeon's IRQ6 vector is a ROM
# address that never matches). This line uses them as a DIFFERENCE, so that constant
# per-frame VBlank contamination CANCELS: 41579-8358 is a clean marginal cost even
# though neither absolute figure is a clean tier cost. What :41 supersedes is the use
# of 8358 as "what the sparse tier costs" — which is not what it is doing here.
# Replacing it with the :44-58 differentials would compare figures from two different
# instruments and silently corrupt the 342.
#
# SUPERSEDED 2026-08-19 BY A DIRECT MEASUREMENT (Scanline P2 Phase 0 Task 3). The reasoning
# above is sound and the 342 was an honest upper bound, but it no longer has to be a bound: the
# HBlank trampoline's own per-routine row measures the same content directly, and the
# FD1/FD2 fixture pair measures the per-line slope directly.
#
#   per-line body      342 (differential, upper bound)  ->  328 measured slope, (FD2-FD1)/32
#   96-line run total  41579 (interrupts.hint)          ->  32758 measured, HBlank row only
#   frame pct          32.5%                            ->  25.7%
#
# AND THE DIFFERENCE IS ITSELF THE CONFIRMATION. 41579 - 32758 = 8821, and VInt_Level measures
# 8280 cyc/frame at idle on the same ROM. The old figure was the dense HBlank run PLUS one
# VBlank, which is exactly what `interrupts.hint` is in this ROM and exactly the size of the
# contamination the caveat predicted. The instrument story is not a theory any more.
per_line_body_cycles_upper_SUPERSEDED = 342
dense_run_cycles_per_frame_SUPERSEDED = 41579   # interrupts.hint = HBlank + VBlank, 2026-08-13
dense_run_frame_pct_SUPERSEDED        = 32.5
#
# AND SUPERSEDED AGAIN 2026-08-19, same day, by the `-4(a2)` dense-stream rider — the one
# booked by substrate Tier-3 item 1 and unblocked by the FD pair this section documents.
# `.dense_body`'s three `move.w (a1)+, VDP_DATA` and `.ramp_body`'s one `move.w d1, VDP_DATA`
# became `d16(An)` writes off the VDP_CTRL already in a2 (20 -> 16 and 16 -> 12 cycles).
#
#   per-line body      328  ->  316 measured slope, (FD2-FD1)/32   (the FULL nominal 3 x 4)
#   96-line run total  32758 -> 31665 measured, HBlank row, same state
#   frame pct          25.7% -> 24.7%
#
# THE PREDICTION WAS 4 AND THE ANSWER WAS 12, and that is worth more than the cycles. The
# dense-kind hoist measured 4 against a nominal 12 and the cost gate's poison confirmed it in
# the other direction, so the standing warning was "nominal over-predicts any edit in this
# body". It over-predicts the edits that remove an OPERAND access next to a control-port
# write, which the CPU pays for out of a VDP wait it was already serving. It does not
# over-predict a shorter INSTRUCTION: the removed word is an instruction-stream fetch on the
# 68000's own account and nothing absorbs it. Both facts are the FD pair's, and neither was
# derivable from the other.
per_line_body_cycles_pre_a2_SUPERSEDED = 328
dense_run_cycles_per_frame_pre_a2_SUPERSEDED = 32758
per_line_body_cycles       = 316     # measured — RASTER_DENSE_LINE_GRAD_CYC, the FD1/FD2 slope; UNMOVED by the LEAVE park, which is charged per RUN
dense_run_cycles_per_frame = 31665   # measured — shipped OJZ_TestGradient (96 lines), HBlank row. NOT re-measured for the LEAVE park (2026-08-19): the poked 96-line leg fell 31848 -> 31616, so this row is expected at ~31433 and the shipped-vs-poked gap below is expected to stand unchanged
dense_run_frame_pct        = 24.7
# The line-count sweep behind the slope: 8 / 40 / 80 / 96 / 120 lines at the same top, poked
# fixtures, one boot each. Fires = lines + 4 at EVERY count and cycles = 1280 + 316 * lines at
# every count, to the cycle. RE-RUN in full for the `-4(a2)` rider AND AGAIN for the dense
# LEAVE parcel rather than re-scaled from the pair, and the two riders are mirror images of
# each other in this table: `-4(a2)` moved every leg by exactly 12 * lines with the intercept
# frozen (a per-LINE cost), the LEAVE park moved every leg by exactly 232 with the SLOPE
# frozen and one fire off every count (a per-RUN cost). Neither is an assumption; both are
# five points. The shipped program is still the one that does not fit -- see
# hint_total_dense_model_gap in [raster.sparse].
dense_line_sweep = "8:3808/12  40:13920/44  80:26560/84  96:31616/100  120:39200/124  (cyc/fires)"
dense_line_sweep_pre_leave_park_SUPERSEDED = "8:4040/13  40:14152/45  80:26792/85  96:31848/101  120:39432/125"
dense_line_sweep_pre_a2_SUPERSEDED = "8:4136/13  40:14632/45  80:27752/85  96:33000/101  120:40872/125"
dense_model_intercept = 1280         # measured — FD1 - 8*316 and FD2 - 40*316, both exactly, and the other three legs agree
dense_model_intercept_pre_leave_park_SUPERSEDED = 1512  # the LEAVE park's whole delta: -232, once per run
# THE DECISION-RELEVANT FACT: this costs ZERO lag frames. VSync_Wait measured 62.8%
# idle WITH the dense run active vs 62.4% without — i.e. the run is absorbed by
# existing slack, because H-INT time nests inside the idle wait rather than adding to
# a saturated frame. So the reserved-register optimisation (corpus ~26 cyc/line,
# Ruling 4c) is a HEADROOM improvement, not a correctness or lag fix, at this content
# density. Caveat: OJZ_ScrollTest is a near-empty game state; a populated level has
# less idle to absorb it, so re-measure before concluding it is free in real content.
transition_arm_lag_fires = 1         # fixed — one pipelined arm at EACH of enter/leave (Ruling 1b)
# Full-frame every-line cost (rejected for the sparse tier): ~224 * per-fire.
# RE-DERIVED 2026-08-19 off the measured 328 slope rather than the superseded 342 upper bound,
# and again the same day off 316 for the `-4(a2)` rider.
full_frame_fraction_ntsc = 0.553  # measured-derived: 224 lines * 316 cyc / 128000
full_frame_fraction_ntsc_SUPERSEDED = 0.76  # 224 * 342, the interrupts.hint-derived upper bound

