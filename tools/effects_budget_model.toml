max_diagonal_enqueue_dirty_buffers_cycles = 1373  # (was 1236)
idle_bganim_update_cycles          = 160     # (was 181)
max_diagonal_bganim_update_cycles  = 144     # (was 74)

# THE HEADROOM, and the finding a budget parcel needs most. VSync_Wait is idle, not cost.
idle_vsync_wait_cycles             = 85444   # 66.8% of the frame is idle (was 79595 / 62.2%)
max_diagonal_vsync_wait_cycles     = 24464   # 19.1% per video frame (was 34371 / 26.9%)
# Max-diagonal still lags, now mildly: 26 ticks in 31 frames (~50 Hz effective, was ~30). Per
# tick the loop costs 95753 cycles against a 128000-cycle frame -- 75% -- and the VBlank
# bracket plus the lag handler are on top of that. The single biggest term is still
