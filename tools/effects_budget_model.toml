# Effects suite budget model (design suite §8) — the ONE machine-readable budget.
# The `code-derived` rows are gated by tools/effects_budget_check.py against the
# [symbols] table at the bottom of this file; the `fixed` rows are documentation with
# provenance; the NEEDS-MEASUREMENT rows are evidence gaps. There is deliberately no
# generator: the measured rows are upper bounds that include profiler instrumentation
# and exception entry (~2090 cyc/fire against a usable_cycles_after_entry of 60), so a
# generated `ensure` would fail programs that demonstrably run today (design spec §4.3).
#
# STATUS KEY:
#   fixed        = a hardware/architecture constant (datasheet or shipped-code derived)
#   code-derived = read from the shipped .emp (const or structural fact)
#   NEEDS-MEASUREMENT = only oracle profiling can give the real number; the value here
#                       is a placeholder/upper-estimate the controller replaces after the
#                       Task-4/5 oracle calibration. DO NOT treat as authoritative.
#
# Provenance for the fixed rows: docs/research/2026-08-12-raster-hint-survey.md.
#
# EVERY CYCLE ROW IN THIS FILE THAT CAME OFF ORACLE IS AN IDEAL-CYCLE FIGURE. Verified
# 2026-08-19 against oracle's own source: the 68000 core adds only `cyclesExecuted` to
# `_currentCycle` (M68000.cpp:1029-1031) while bus/VDP/DMA stall accumulates in
# `additionalTime` and lands in `_currentTime`; the profiler ring stamps `_currentCycle`
# (M68000.h:95). So stall time reaches the wall clock and never reaches a cycle row. That is
# why the code-derived model and the measured rows agree to the cycle — both count nominal
# 68000 instruction timings — and it is the reason max_contiguous_dma_stall_cycles below is
# recorded as UNMEASURABLE rather than as a number.

[engine_reservation]
# The standing engine cost a scene budget is measured AGAINST, not part of. Design §5: every
# axis budget is `pool - engine_reservation`. Two states, BOTH DEFINED IN
# docs/benchmarks/scanline-p2/ENGINE-BASELINE.md — a reservation whose camera state is not
# reproducible is not a reservation, which is how the effects-p3 baseline rows went stale.
#
# Scanline P2 Phase 0 Task 2, 2026-08-19 (crc d22dda85); RE-TAKEN by Scanline P3 Task 13,
# 2026-08-22, on the P3 tip — s4.debug.bin crc 0dbaa80f len 715010 — because every row here
# was measured against the pre-unroll walker and both the fill-unroll parcel and the
# streaming arc landed in between. 31-frame sample, FIVE independent boots per state,
# SPREAD 0 on every row of both states (idle taken twice this session, rows byte-identical;
# wall 64 s, uptime 01:54:36 load 3.44 -> 01:55:40 load 4.57).
# tools/engine_baseline_probe.py --state idle,maxdiag --repeat 5.
# The superseded 2026-08-19 values are kept in parentheses beside each row that moved.
status = "measured"
instrument = "ORACLE per-routine rows (oracle-next has no profiler); interrupts.hint is NEVER a valid source here -- it sums HBlank and VBlank. Cycle figures are IDEAL-CYCLE: the clock excludes bus/VDP/DMA stall (M68000.cpp:1029-1031)"

# THE DENOMINATOR PROBLEM, AND WHY THERE ARE TWO OF EVERY MAX-DIAGONAL ROW. Sustained
# max-diagonal does not run at 60 Hz. Measured on the engine's own counters (Frame_Counter vs
# Logic_Tick, the latter documented in engine/ram.emp as "lag-immune"): 31 video frames carry
# 26 logic ticks, i.e. 1.192 video frames per tick, spread 0 across five boots, with
# Lag_Frame_Count advancing 5. Idle runs 1.033. (The 2026-08-19 vintage read 2.067 with lag
# +16 -- the streaming arc landed in between and moved the whole state; see the arc's
# closeout.) It is NOT the art soft-clamp -- Camera_Art_Hold reads 0 and DEBUG's
# Dbg_Cam_Clamp_Frames stays 0 for the whole run, both checked. The camera still advances
# CAM_MAX_STEP per TICK on both axes, which is the second, independent witness:
# camera-derived ticks == the Logic_Tick delta exactly (26.00 vs 26).
#
# So a max-diagonal routine has two honest figures and both are here. The per-VIDEO-FRAME one
# is what the 128000-cycle budget divides; the per-LOGIC-TICK one is what one invocation of the
# work actually costs. Quoting only the first understates every routine by 1.19x.
frames_per_logic_tick_idle        = 1.033
frames_per_logic_tick_max_diagonal = 1.192   # (was 2.067)

# The main-loop bracket: GameState_OJZScroll_Update, one call per logic tick.
idle_main_loop_cycles              = 29472    # per video frame (was 35125)
max_diagonal_main_loop_cycles      = 80309    # per video frame (was 55144)
idle_main_loop_cycles_per_tick     = 30454    # (was 36296)
max_diagonal_main_loop_cycles_per_tick = 95753  # (was 113964)

# The VBlank bracket: VInt_Level. Raster_VBlank runs INSIDE it, before Flush_VDP_Shadow and
# every DMA drain, so this is the number a VBlank axis is a fraction of -- not Raster_VBlank's
# own row. VInt_Lag is the spare VBlanks a lagging tick spends, listed beside it.
idle_vblank_cycles                 = 8277     # (was 8280)
max_diagonal_vblank_cycles         = 11338    # (was 6117 -- the 08-19 state lagged 2.07x, so
                                              # one VInt_Level spread over two VBlanks; at
                                              # 1.192 most frames carry a full bracket)
idle_vblank_cycles_per_tick        = 8553     # (was 8556)
max_diagonal_vblank_cycles_per_tick = 13518   # (was 12642)
idle_vblank_lag_cycles             = 166
max_diagonal_vblank_lag_cycles     = 806      # (was 2904)

