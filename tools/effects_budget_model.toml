idle_parallax_update_cycles        = 13492   # (was 19511: the fill-unroll + re-glue walker.
                                             # NOTE this is the baseline probe's per-video-frame
                                             # row at the idle tick rate 1.033; the walker
                                             # probe's preemption-free per-CALL figure on the
                                             # same ROM is 13834 -- [parallax.cost_model]
                                             # out_of_sample_measured. Both true; the axis-1
                                             # subtraction uses this one because it shares its
                                             # window with idle_main_loop_cycles.)
max_diagonal_parallax_update_cycles = 13612  # (was 12189)
idle_raster_vblank_cycles          = 1482
max_diagonal_raster_vblank_cycles  = 1488
idle_palette_compose_cycles        = 145
