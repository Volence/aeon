                                     # budget: the 2026-08-19 sweep MEASURED the H40
                                     # blanking window at 122.9 cycles, twice this, and
                                     # every ceiling row below now derives from that.
                                     # docs/benchmarks/scanline-p2/HBLANK-WINDOW-SWEEP-RESULTS.md
