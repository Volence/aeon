[scene_budget]
# THE SCENE BUDGET (Scanline P2 Tasks 10/11/13, design §5). Landed 2026-08-19.
#
# ENFORCEMENT DOES NOT LIVE HERE. The `ensure`s in engine/level/scene_dsl.emp's
# `scene_budget_enforce()` are the single authority (design §5's ownership rule: the comptime
# DSL alone sees every scene, through the registry). Every row in this table is PROVENANCE —
# it says where a number came from and lets a reader detect drift. If a row here is deciding
# whether a build passes, it is in the wrong place.
#
# THE AGGREGATION IS `max`, NOT `sum` — A CORRECTION TO design §5 AND TO THE PLAN. Only one
# scene is live at a time: a game with twenty scenes runs the one its current section binds,
# not twenty walkers. Summing axis 1 over the shipped twenty gives ~500,000 cycles against a
# 128,000-cycle frame, so a SUM gate would refuse a registry that demonstrably runs today.
# The pairwise SUM genuinely belongs to the TRANSITION FRAME, which is Task 12 — BLOCKED, and
# booked in docs/DEFERRED_WORK.md. When it lands it ADDS a pairwise term on top of these max
# rows rather than replacing them.
#
# DENOMINATORS ARE THE IDLE CAMERA STATE, per the Phase-0 ruling. Sustained max-diagonal does
# not run at 60 Hz (frames_per_logic_tick_max_diagonal 2.067) and is streaming-bound
# (Tile_Cache_Fill 40.1%/tick, a separately-owned arc), so its rows are context carried with
# BOTH denominators above and are never a gate divisor.
status = "code-derived (enforced in engine/level/scene_dsl.emp; these rows are provenance)"
aggregation = "max over scenes — one scene is live at a time; the pairwise sum is Task 12's transition frame, BLOCKED"

# ---- The four ENFORCED axes, with the derivation of each budget ----
# Axis 1 reservation: idle_main_loop_cycles less the walker's OWN idle_parallax_update
# (charging a scene the walker while leaving the baseline walker in the reservation
# would double-count the very thing being budgeted), plus idle_vblank_cycles.
# RE-DERIVED by P3 Task 13 (2026-08-22) from the [engine_reservation] re-take above,
# because the walker's idle cost moved and the subtraction moves with it:
#   was:  (35125 - 19511) + 8280 = 15614 + 8280 = 23894
#   now:  (29472 - 13492) + 8277 = 15980 + 8277 = 24257
# The walker got 6019/frame cheaper, yet the RESERVATION ROSE 363: the non-walker main loop
# went 15614 -> 15980 (+366 -- P3's non-walker mechanisms live outside Parallax_Update), and
# VInt_Level gave back 3. All three components share one probe window (idle, 1.033
# frames/tick), so the subtraction is internally consistent -- see the note on
# idle_parallax_update_cycles for why 13492 and not the walker probe's per-call 13834.
axis1_pool_cycles        = 128000
axis1_reservation_cycles = 24257     # 15980 non-walker main loop + 8277 VInt bracket
axis1_budget_cycles      = 103743
axis1_worst_scene_cycles = 42740.77  # max over the shipped 20, from the fitted walker model
                                     # (scene_budget_report.py on this build; was 38052.27
                                     # against the P2-era transcription. HIGHER despite the
                                     # per-line intercepts getting ~3x cheaper: the promoted
                                     # model's new worst-case charges — shift amplitude,
                                     # per-sampling-band prologue, per-trip anchor — net out
                                     # larger on the worst scene, the conservative direction)
# Axis 2: the measured queue less the per-line HScroll entry, which is the SCENE's.
#
# ##### RE-ATTRIBUTED BY P3 TASK 6 STEP 1, 2026-08-20 — THE SUM IS UNCHANGED. #####
# The scene's own charge was 1792 B (two entries) and the reservation 1264 B; the forcer is
# ONE 896 B entry, so 896 B moved from the scene's column into the reservation's. The TOTAL
# axis-2 pressure a per-line scene implies is 3056 B either way, which is deliberate: the
# guard is exactly as tight as it was, and no budget was loosened on the strength of a
# measurement correction that only re-attributed the bytes.
#
# THE RESERVATION IS A CEILING, RE-TAKEN AND KEPT BY P3 TASK 13 (2026-08-22). 2160 is the
# whole-region scan total (3056 B, live + drain residue) less the scene's 896 B. The tip
# re-take reproduced every input: whole-region 1528 w idle / 1519 w maxdiag, live 492 w idle
# (984 B, the same four entries) / 483 w maxdiag, max single transfer 576 w, five boots,
# spread 0 -- so the ceiling's derivation is unchanged and the row stands. The honest LIVE
# figure is still 984 B less 896 = 88 B of non-scene live DMA at the scan instant — but that
# state has an EMPTY Important queue, so an 88 B reservation would under-reserve for the
# engine's largest DMA client (art streaming: the 1152 B page transfer this scan sees only as
# residue). A TRUE derivation of "standing non-scene DMA" needs an instrument this tree does
# not have: a per-frame UNION of live enqueues across a streaming-active window (the
# scanline-220 scan cannot see entries enqueued and drained inside VBlank). Booked in
# docs/DEFERRED_WORK.md with that unlock condition. Over-reserving is the safe direction to
# sit in until then.
axis2_pool_bytes         = 7524      # H40 NTSC VBlank DMA capacity
axis2_reservation_bytes  = 2160      # CEILING: whole-region 3056 B less the scene's ONE 896 B
axis2_budget_bytes       = 5364
axis2_worst_scene_bytes  = 896       # a per-line scene: ONE 448-word entry (Task 6 ruling)
# Axis 3: the DRAIN of axis 2's bytes, derived from documented hardware rates exactly as
# dma_max_single_transfer_derived_cycles is — 896 B / 205 B-per-line x 488.57 cyc-per-line.
# HALVED BY THE SAME RULING: the drain was derived from the 1792 B figure, so correcting the
# byte count corrects this row too. NOT double-counted against the 8280: oracle's cycle clock
# excludes bus/DMA stall by construction (M68000.cpp:1029-1031), so no measured cycle row
# contains it.
axis3_pool_cycles        = 18200     # the NTSC VBlank window
axis3_reservation_cycles = 8280      # idle_vblank_cycles, the VInt_Level bracket
axis3_budget_cycles      = 9920
axis3_worst_scene_cycles = 2135
# THE COMBINED PER-LINE TAX, which design §5 Step 2 asks be shown as ONE number so that "12%"
# never reads as the whole story.
per_line_combined = "896 B of VBlank DMA (11.9% of the 7524 B pool) AND 2135 cyc of drain (11.7% of the 18200-cyc VBlank window) — design §5's 896 B / 12% for the DMA half was RIGHT, and the 1792 B that stood here from P2 until 2026-08-20 was a queue scan counting drain residue as a second live entry (see [dma]). The drain half is still the part §5 does not price at all"
# Axis 4b: enforced in engine/effects/raster_dsl.emp's `check_hint_total`, inside
# raster_program(), because scenes do not fire HInts and the section->preset->program chain is
# Labels end to end (the same barrier that blocks Task 12). Model cycles on BOTH sides — never
# compared against the measured rows, which include profiler instrumentation and exception entry.
# NOTE (P3 Task 13, 2026-08-22): 43405 derives from the SUPERSEDED 2026-08-19 idle rows
# (35125 + 8280); the re-taken components give 29472 + 8277 = 37749. NOT re-derived here,
# deliberately: the constant lives in raster_dsl.emp (RASTER_HINT_RESERVATION_CYC, [symbols]
# row below) with its own guard set, the plan scoped Task 13's derivation step to axis 1, and
# the stale value errs in the SAFE direction (over-reserved by 5656 on an axis the 4a density
# guard already bounds below budget). Booked in docs/DEFERRED_WORK.md.
axis4b_pool_cycles        = 128000
axis4b_reservation_cycles = 43405    # idle_main_loop 35125 + idle_vblank 8280 (08-19 vintage, CEILING)
axis4b_budget_cycles      = 84595

# ---- FALSIFIABILITY: WHICH GUARDS CAN ACTUALLY GO RED, MEASURED ----
#
# Stated plainly because this tree's most expensive lesson is the gate that reads as coverage
# and tests nothing. Of the four enforced axes, exactly ONE has an input that can cross its
# budget, and that is a property of the shipped model rather than a defect in the guards:
#
#   AXIS 1  FALSIFIABLE, unit = one band. RE-DERIVED by P3 Task 13 under the promoted model
#           and reservation: 93 bands costs 103352.26 and passes (391 cyc headroom); 94
#           costs 104411.37 and fails by 668 cyc — the smallest overrun one band admits,
#           since a band's marginal is now 1059.1 cyc (band_perline 854.00 + 3 anchor trips
#           x 60.77, x1.022). BUT `scene()` caps count at MAX_PARALLAX_BANDS (8), where the
#           worst possible constructor scene (both planes at shift 14, curve layer, V-deform,
#           anchored, every worst-case charge stacked) costs 67549.93 — 65% of budget. So
#           the guard's live role is a ledger row plus a BACKSTOP on the documented
#           `Scene{ .. }` back door, which is what games/sonic4/test/poison/poison_budget_axis1.emp
#           probes (red-first verified 2026-08-22: 1 diagnostic, exactly the axis-1 message,
#           quoting 104411 against 103743).
#   AXIS 2  NOT FALSIFIABLE. The per-scene charge is two-valued — 0 or 896 B — and 896 +
#           2160 = 3056 fits 7524 always. It becomes falsifiable if a second per-line forcer
#           class is added, or if the pool shrinks (PAL H40, or a VRAM-heavier frame).
#           (The 2026-08-20 re-attribution did not change this verdict: the sum it is judged
#           on is the same 3056.)
#   AXIS 3  NOT FALSIFIABLE, for the same reason: 0 or 2135 cyc, and 2135 + 8280 = 10415 fits
#           18200 always. Same unlock conditions as axis 2.
#   AXIS 4b NOT FALSIFIABLE IN PRACTICE, and the reason is that axis 4a already bounds it: the
#           density guard requires each fire's cost to fit its gap, so a whole screen cannot
#           exceed 224 x 488 = 109312 model cycles, and at the shipped burst ceilings (3 words,
#           max modelled fire ~688 cyc at gap 2) a saturated program tops out near 77000
#           against an 84595 budget. It becomes falsifiable if the burst ceilings rise or a
#           costlier op class lands.
#   AXIS 5  NOT FALSIFIABLE (measured by derivation, P3 Task 14 — the enforce landed 2026-08-22
#           in scene_budget_enforce(), three sub-ceiling ensures). The per-scene charge is
#           two-valued on every sub-ceiling — 0 (Factor0Lock / Accept / Undeclared) or the
#           SpriteMask strip's fixed price (1 sprite/line, 8 px/line, 7 table slots) — and
#           BOTH values fit every ceiling always: 1 + 2 = 3 fits 20, 8 + 32 = 40 fits 320,
#           7 + 3 = 10 fits 80. It is doubly unreachable today: scene() refuses an authored
#           SpriteMask until its engine emission lands, so the nonzero branch has no authored
#           path at all, and even the documented Scene{ .. } back door (which the enforce DOES
#           price — verified red-first with a planted declarer against a 74-slot perturbed
#           reservation) reaches only the fitting 1/8/7. UNLOCK CONDITIONS, any of: (a) a
#           second scene-authored sprite consumer lands (a CAP_FG_SPRITE_STRIPS lowering, or a
#           multi-strip mask primitive) making the charge stackable past a ceiling; (b) a
#           populated-level re-measure of [engine_reservation] raises a reservation past
#           pool - price (line sprites > 19, pixels > 312, table slots > 73 — re-measure
#           events, not authored inputs, the same class as axis 2's 'pool shrinks'); (c) the
#           mask geometry widens or grows (pixels bind first: a strip wider than 288 px, i.e.
#           SPRITE_MASK_SIZE beyond the VDP's 4-cell max, is unreachable — table slots would
#           need SPRITE_MASK_HEIGHT small enough that ceil(224/H) > 73, i.e. H <= 3, equally
#           unreal; the practical unlock is (a) or (b)).
#
# FOUR POISONS WERE THEREFORE BOOKED RATHER THAN FAKED (axes 2, 3, 4b — and 5 since P3
# Task 14). A fixture that cannot go red would be the exact defect the expect-fail lane exists
