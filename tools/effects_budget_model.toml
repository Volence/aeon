# Effects suite budget model (design suite §8) — the ONE machine-readable budget.
# The `code-derived` rows are gated by tools/effects_budget_check.py against the
# [symbols] table at the bottom of this file; the `fixed` rows are documentation with
# provenance; the NEEDS-MEASUREMENT rows are evidence gaps. There is deliberately no
# generator: the measured rows are upper bounds that include profiler instrumentation
# and exception entry (~2090 cyc/fire against a usable_cycles_after_entry of 60), so a
# generated `ensure` would fail programs that demonstrably run today (design spec §4.3).
#
# STATUS KEY:
#   fixed        = a hardware/architecture constant (datasheet or shipped-code derived)
#   code-derived = read from the shipped .emp (const or structural fact)
#   NEEDS-MEASUREMENT = only oracle profiling can give the real number; the value here
#                       is a placeholder/upper-estimate the controller replaces after the
#                       Task-4/5 oracle calibration. DO NOT treat as authoritative.
#
# Provenance for the fixed rows: docs/research/2026-08-12-raster-hint-survey.md.

[hblank_window]
# The binding limit on per-fire VDP work is the cycle window between HINT-pending and
# the next line's active display, NOT the 4-entry FIFO (survey Ruling 2a).
h40_line_mclk        = 3420          # fixed — H40 scanline, NTSC and PAL alike (Ruling 2c)
hint_to_hblank_68k_cycles = 105      # fixed — ~90px $A6->$00 ~= 733 mclk ~= 105 68k cyc
autovector_entry_cycles   = 44       # fixed — IRQ4 autovector exception entry
usable_cycles_after_entry = 60       # fixed — the ~60-cycle budget (105 - 44, rounded)
status = "fixed"

[raster.sparse]
cram_words_per_fire  = 3             # code-derived — RASTER_CRAM_MAX (engine/effects/raster.emp)
cram_words_reason    = "cycle budget, not FIFO (Ruling 2a); a 16-colour line cannot swap in one fire"
save_set_registers   = 4            # code-derived — movem d0-d1/a1-a2 in Raster_HInt
movem_roundtrip_cycles = 40         # fixed — 4-register movem push+pop
# Per-fire handler cost (arm write + op parse + one OP_CRAM of 3 colours). The corpus
# lower bound is ~26 cyc (zero-save, Ruling 4c); ours saves 4 registers.
# SUPERSEDED 2026-08-14 — DO NOT USE. The 8358 figure was read from the profiler's
# `interrupts.hint` block, which INCLUDES VBlank: oracle buckets interrupt time by
# comparing the handler's entry PC against 0x78, and Aeon's IRQ6 vector is
# `dc.l VBlank_Handler`, a ROM address that never matches. Confirmed three times on live
# data, to the cycle: interrupts.hint == HBlank_Vector_Slot + VBlank_Handler, with
# interrupts.vint reading 0 throughout. So this row was two handlers summed, and every
# absolute HInt number previously in this tree carried the same error.
sparse_tier_cycles_per_frame_SUPERSEDED = 8358
sparse_tier_frame_pct_SUPERSEDED        = 6.5

# MEASURED 2026-08-14 (oracle, OJZ section 0, differentials within one shape so the
# instrument's constant terms cancel). Evidence: docs/benchmarks/effects-p3/DENSITY-EVIDENCE.md
#   3 records (2 priming + 1 vsram event)  = 1026 cyc/frame
#   8 records (2 priming + 6 vsram events) = 3296  -> marginal 454 cyc per fire
#   8 records (2 priming + 6 cram3 events) = 3656  -> marginal 526 cyc per fire
sparse_fire_vsram1_cycles = 454      # measured-differential
sparse_fire_cram3_cycles  = 526      # measured-differential
ntsc_scanline_cycles      = 488      # fixed — 128000 / 262, floored
# The consequence, and the rule the density guard encodes: a 1-word vsram fire FITS
# inside a scanline and adjacent vsram fires are clean; a 3-colour cram fire does NOT,
# so consecutive colour fires overrun into active display and paint a mid-line colour
# change. Nothing is dropped — `calls` stays 8 — the writes just land late.
adjacent_fire_verdict = "vsram1 OK adjacent; cram3 must be spaced >= 2 lines"
per_fire_cycles      = "see sparse_fire_* rows above (measured-differential)"
program_overhead_fires = 2           # code-derived — the two priming records

[raster.op_pal_region]
# A region is a SCOPED colour swap (<= cram_words_per_fire), streamed from a variant's
# Pal_Variant_Stage bytes. A full-line region spreads across ceil(16/3)=6 fires.
max_colours_per_fire = 3             # code-derived — bound by RASTER_CRAM_MAX
handler_extra_cycles = "NEEDS-MEASUREMENT"  # oracle: lea+adda.w+stream vs a plain OP_CRAM
# RENAMED 2026-08-14. This was `full_line_fire_cost`, which read as a CYCLE cost while
# being ceil(16/3) — a LINE COUNT — tagged `code-derived`, i.e. arithmetic wearing a
# measurement's label. It is how many fires a 16-colour line needs, nothing more.
full_line_fire_lines = 6             # code-derived — ceil(16 / 3)
# And the measured consequence: six of them CONSECUTIVELY is refused by the density
# guard, because a 3-colour cram fire is 526 cyc against a 488-cyc line. A full-line
# swap belongs in the dense tier, which stays inside one interrupt.
full_line_consecutive_verdict = "REFUSED — space them, or use the dense tier"

[raster.dense]
# OP_RUN_GRADIENT: fire every line (reg $0A=0), minimal per-line body.
mode = "every-line"
# MEASURED 2026-08-13 (oracle profiler, OJZ section 2, 96-line run = 101 fires/frame).
# Dense H-INT total 41579 cyc/frame (32.5%) vs sparse 8358 (6.5%); the marginal cost of
# the 97 extra fires is (41579-8358)/97 = ~342 cyc/line. That INCLUDES profiler
# instrumentation, autovector entry and rte, so it is an upper bound on the body.
#
# THE 8358 HERE IS DELIBERATE AND STILL VALID — do not "correct" it to the superseded
# marker at :41. Both 41579 and 8358 came off the SAME profiler on the SAME day under
# the SAME instrument bug (oracle's `interrupts.hint` bucket includes VBlank, because
# it classifies by comparing entry PC against $78 and Aeon's IRQ6 vector is a ROM
# address that never matches). This line uses them as a DIFFERENCE, so that constant
# per-frame VBlank contamination CANCELS: 41579-8358 is a clean marginal cost even
# though neither absolute figure is a clean tier cost. What :41 supersedes is the use
# of 8358 as "what the sparse tier costs" — which is not what it is doing here.
# Replacing it with the :44-58 differentials would compare figures from two different
# instruments and silently corrupt the 342.
per_line_body_cycles_upper = 342
dense_run_cycles_per_frame = 41579   # a 96-line run
dense_run_frame_pct        = 32.5
# THE DECISION-RELEVANT FACT: this costs ZERO lag frames. VSync_Wait measured 62.8%
# idle WITH the dense run active vs 62.4% without — i.e. the run is absorbed by
# existing slack, because H-INT time nests inside the idle wait rather than adding to
# a saturated frame. So the reserved-register optimisation (corpus ~26 cyc/line,
# Ruling 4c) is a HEADROOM improvement, not a correctness or lag fix, at this content
# density. Caveat: OJZ_ScrollTest is a near-empty game state; a populated level has
# less idle to absorb it, so re-measure before concluding it is free in real content.
transition_arm_lag_fires = 1         # fixed — one pipelined arm at EACH of enter/leave (Ruling 1b)
# Full-frame every-line cost (rejected for the sparse tier): ~224 * per-fire.
full_frame_fraction_ntsc = 0.76   # measured-derived: 224 lines * 342 cyc / 128000 (upper bound)

[palette]
max_active_variants  = 2             # code-derived — PAL_MAX_VARIANTS (raise only on evidence)
cycle_max_channels   = 4             # code-derived — PAL_CYCLE_MAX_CHANNELS
fade_window_frames   = 16            # code-derived — PAL_FADE_FRAMES
compose_static_frame = "one compare (tst.b Pal_Active)"  # code-derived — early-out, and TRUE again as of the fix below
# RESOLVED 2026-08-13 (fix/palette-variant-derive). The 15.1% figure below WAS real and
# WAS the biggest single cost in the effects suite; it is now ~0.
#
# The early-out was never broken. Pal_Active answers "is a slot bound?", but the derive
# needed "did this layer's input change?" — so a bound-but-static variant recomputed a
# bit-identical staging image every frame. Confirmed on hardware before the fix:
# Pal_Active = $10 (variant-only), with Palette_Buffer AND Pal_Variant_Stage verified
# bit-identical across frames. PAL_ACT_VARIANT_STALE (Pal_Active bit 5) now gates it.
#
# A/B, same scene, same 30 frames, profiler on both shapes of the change:
#   Palette_DeriveVariant  19332 (15.1%) -> absent from top-14 (floor 1095 cyc)
#   Palette_Compose        19568 (15.3%) -> absent
#   VSync_Wait idle        80267 (62.7%) -> 99688 (77.9%)   [+15.2 points]
# Pal_Variant_Stage byte-identical after the fix: same image, ~19.5k fewer cycles.
compose_variant_derive_cycles = 0        # was 19332 — gated; pays only on frames whose source moved
compose_variant_derive_pct    = 0.0      # was 15.1
# The cost when it DOES run (a cycling/fading frame) is unchanged at ~19332 for a
# 3-line variant — 48 entries at ~403 cyc. That is the remaining target if real content
# runs cycling or a fade continuously; the per-channel bind-time LUT (lever C in the
# design) is the answer there, NOT another gate. NEEDS-MEASUREMENT in real content.
compose_variant_derive_when_stale_cycles = 19332
compose_fade_step_cycles      = "NEEDS-MEASUREMENT"  # no fade was armed in the measured captures
palette_compose_total_cycles  = 0        # was 19568 — see above

[ram]
# code-derived — the two effects RAM blocks (engine/ram.emp span guards).
palette_state_bytes  = 472           # PALETTE_STATE_SIZE
raster_state_bytes   = 306           # RASTER_STATE_SIZE (Program/Cursor/Pending/Line + Buf_A/Buf_B 128 each + Active_Buf + dense + ramp + Effects_World_Y[4] + Patch_Tab)
                                     # 288 -> 306 in effects-P3 P-b: -4 for the deleted single-channel water pair
                                     # (Raster_Water_Line + Raster_Water_World_Y), +8 for Effects_World_Y[RASTER_MAX_PATCH],
                                     # +4 for Raster_Patch_Tab, +10 for the ramp cells already present but never added here.
variant_stage_bytes  = 256           # PAL_MAX_VARIANTS * 128 (part of palette_state)
free_before_stack_kb = 31.8   # measured — build.sh reports it each build

# ---------------------------------------------------------------------------
# [symbols] — the machine-readable half of the "code-derived" status key. Each entry
# maps a dotted row path above to the .emp constant that is its authority;
# tools/effects_budget_check.py resolves the constant and fails on disagreement.
#
# NOT resolvable, deliberately absent, and recorded here so their absence is not read
# as an oversight: save_set_registers (a `movem` operand, not a constant),
# program_overhead_fires (no symbol exists), full_line_fire_lines (ceil(16/3), computed
# prose), compose_static_frame (prose). The two NEEDS-MEASUREMENT rows are evidence
# gaps, not build gates.
[symbols]
"raster.sparse.cram_words_per_fire"         = "engine/effects/raster.emp:RASTER_CRAM_MAX"
"raster.op_pal_region.max_colours_per_fire" = "engine/effects/raster.emp:RASTER_CRAM_MAX"
"palette.max_active_variants"               = "engine/effects/palette.emp:PAL_MAX_VARIANTS"
"palette.cycle_max_channels"                = "engine/effects/palette.emp:PAL_CYCLE_MAX_CHANNELS"
"palette.fade_window_frames"                = "engine/effects/palette.emp:PAL_FADE_FRAMES"
"ram.palette_state_bytes"                   = "engine/effects/palette.emp:PALETTE_STATE_SIZE"
"ram.raster_state_bytes"                    = "engine/effects/raster.emp:RASTER_STATE_SIZE"
"ram.variant_stage_bytes"                   = "engine/effects/palette.emp:PAL_MAX_VARIANTS * 128"
