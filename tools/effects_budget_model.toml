# Effects suite budget model (design suite §8) — the ONE machine-readable budget.
# The `code-derived` rows are gated by tools/effects_budget_check.py against the
# [symbols] table at the bottom of this file; the `fixed` rows are documentation with
# provenance; the NEEDS-MEASUREMENT rows are evidence gaps. There is deliberately no
# generator: the measured rows are upper bounds that include profiler instrumentation
# and exception entry (~2090 cyc/fire against a usable_cycles_after_entry of 60), so a
# generated `ensure` would fail programs that demonstrably run today (design spec §4.3).
#
# STATUS KEY:
#   fixed        = a hardware/architecture constant (datasheet or shipped-code derived)
#   code-derived = read from the shipped .emp (const or structural fact)
#   NEEDS-MEASUREMENT = only oracle profiling can give the real number; the value here
#                       is a placeholder/upper-estimate the controller replaces after the
#                       Task-4/5 oracle calibration. DO NOT treat as authoritative.
#
# Provenance for the fixed rows: docs/research/2026-08-12-raster-hint-survey.md.

[hblank_window]
# The binding limit on per-fire VDP work is the cycle window between HINT-pending and
# the next line's active display, NOT the 4-entry FIFO (survey Ruling 2a).
h40_line_mclk        = 3420          # fixed — H40 scanline, NTSC and PAL alike (Ruling 2c)
hint_to_hblank_68k_cycles = 105      # fixed — ~90px $A6->$00 ~= 733 mclk ~= 105 68k cyc
autovector_entry_cycles   = 44       # fixed — IRQ4 autovector exception entry
usable_cycles_after_entry = 60       # fixed — the ~60-cycle budget (105 - 44, rounded)
status = "fixed"

[raster.sparse]
cram_words_per_fire  = 3             # code-derived — RASTER_CRAM_MAX (engine/effects/raster.emp)
cram_words_reason    = "cycle budget, not FIFO (Ruling 2a); a 16-colour line cannot swap in one fire"
save_set_registers   = 4            # code-derived — movem d0-d1/a1-a2 in Raster_HInt
movem_roundtrip_cycles = 84         # fixed — 4-register movem push+pop: 68000 movem is
                                    # 8 + 8n register-to-memory and 12 + 8n back, so at n = 4
                                    # the push is 40 and the pop 44. CORRECTED 2026-08-18 from
                                    # 40, which is the PUSH ONLY — half of the round trip the
                                    # row names. Same defect as raster.emp's header note, fixed
                                    # in the same parcel; this row is not read by anything
                                    # either, so nothing downstream moves.
movem_roundtrip_cycles_SUPERSEDED = 40  # push only, mislabelled as the round trip
# Per-fire handler cost (arm write + op parse + one OP_CRAM of 3 colours). The corpus
# lower bound is ~26 cyc (zero-save, Ruling 4c); ours saves 4 registers.
# SUPERSEDED 2026-08-14 — DO NOT USE. The 8358 figure was read from the profiler's
# `interrupts.hint` block, which INCLUDES VBlank: oracle buckets interrupt time by
# comparing the handler's entry PC against 0x78, and Aeon's IRQ6 vector is
# `dc.l VBlank_Handler`, a ROM address that never matches. Confirmed three times on live
# data, to the cycle: interrupts.hint == HBlank_Vector_Slot + VBlank_Handler, with
# interrupts.vint reading 0 throughout. So this row was two handlers summed, and every
# absolute HInt number previously in this tree carried the same error.
sparse_tier_cycles_per_frame_SUPERSEDED = 8358
sparse_tier_frame_pct_SUPERSEDED        = 6.5

# RE-MEASURED 2026-08-16 on the PER-ROUTINE row (tools/raster_cost_probe.py), which reads
# the HBlank trampoline alone. Evidence: docs/benchmarks/effects-p3/DENSITY-EVIDENCE.md.
# Noise floor ZERO — five independent boots per fixture, eight fixtures, spread 0 on all.
#
# The 2026-08-14 values these replace (454 / 526) came off `interrupts.hint`, which in this
# ROM is HBlank + VBlank summed, so their differentials carried VBlank schedule-build work.
# They were nonetheless close: 454 against 458, 526 against 518. The superseded pair is kept
# below rather than deleted, because a later reader finding "454" in an old doc needs to be
# able to tell which measurement it was.
# RE-MEASURED 2026-08-18 after substrate item 1 moved the blanking spin into the program:
# every STREAM op pays +4 (move.w read replacing the moveq), so every row below except the
# reg-only one moved by exactly that, and the reg-only row did not move at all. All eight
# fixtures re-read on hardware and matched the prediction to the cycle.
sparse_fire_vsram1_cycles = 462      # measured — fixture F7 (and F2, identical)
sparse_fire_cram3_cycles  = 522      # measured — fixture F3
sparse_fire_reg1_cycles   = 412      # measured — fixture F1; UNMOVED (SetReg streams nothing)
sparse_fire_region3_cycles = 570     # measured — fixture F4
sparse_fire_water_cycles  = 680      # modelled — reg_sh_on + 3-word region, the OJZ water fire
sparse_fire_vsram1_cycles_SUPERSEDED = 454   # interrupts.hint differential, 2026-08-14
sparse_fire_cram3_cycles_SUPERSEDED  = 526   # interrupts.hint differential, 2026-08-14
sparse_fire_vsram1_cycles_SUPERSEDED2 = 458  # pre-item-1, spin folded into the work constant
sparse_fire_cram3_cycles_SUPERSEDED2  = 518  # pre-item-1
sparse_fire_region3_cycles_SUPERSEDED = 566  # pre-item-1
sparse_fire_water_cycles_SUPERSEDED2  = 676  # pre-item-1
# CORRECTED 2026-08-18 — these two contradicted a LIVE `ensure` and this file said nothing,
# because no gate reads the sparse_fire_* rows (only [symbols] rows are checked). Found
# independently by three seats of the raster-substrate lens sweep. Both were the RUNGS=4
# figures, superseded when R1 added the fifth dispatch rung and every SetReg got 16 cyc
# dearer; the _SUPERSEDED convention this file already uses simply was not applied.
#   reg1:  raster_dsl.emp's fixture F1 `ensure` pins 412 and says so in its own trailing
#          note, "was 396 at RUNGS=4". Model derivation: fire_base 302 + SetReg
#          (fetch 8 + dispatch 16*5 + work 12 + tail 10 = 110) = 412.
#   water: raster_dsl.emp derives it in that arithmetic — "merged fire tops out at
#          302 + 110 + 264 = 676". The 264 is the region op: fetch 8 + dispatch
#          (16*1 + hit 18 = 34) + work 122 + 30*3 stream words + tail 10.
# The other three rows were re-checked against the same pins and are correct as they stand
# (F7/F2 458, F3 518, F4 566).
sparse_fire_reg1_cycles_SUPERSEDED   = 396   # RUNGS=4, pre-R1 dispatch chain
sparse_fire_water_cycles_SUPERSEDED  = 660   # RUNGS=4, pre-R1 dispatch chain
ntsc_scanline_cycles      = 488      # fixed — 128000 / 262, floored

# The consequence, and the rule the density guard encodes: a 1-word vsram fire FITS
# inside a scanline and adjacent vsram fires are clean; a 3-colour cram fire does NOT,
# so consecutive colour fires overrun into active display and paint a mid-line colour
# change. Nothing is dropped — `calls` stays 8 — the writes just land late.
adjacent_fire_verdict = "vsram1 OK adjacent; cram3 must be spaced >= 2 lines"
per_fire_cycles      = "see sparse_fire_* rows above, and [raster.cost_model] for the model that predicts them"
program_overhead_fires = 2           # code-derived — the two priming records

# The cost model's own constants, gated against raster_dsl.emp by the [symbols] table below.
# Structure: fire_base ONCE per fire, then per op fetch + dispatch(depth) + class work +
# word slope x stream words + loop tail. Every constant confirmed twice — measured on oracle
# AND hand-counted off the emitted 68000 stream at s4.debug.bin $79CC..$7A5C.
#
# NOTE this table is code-derived and therefore GATED, unlike the measured rows above it.
# That is deliberate and it is the point of the parcel: the numbers a guard actually uses
# now have a machine-checked path back to the shipped code, so a constant cannot drift out
# from under this file the way `418 + 36x` did.
[raster.cost_model]
fire_base_cycles       = 280         # code-derived — RASTER_FIRE_BASE_CYC
op_fetch_cycles        = 8           # code-derived — move.w (a1)+, d1
dispatch_rung_cycles   = 16          # code-derived — a FAILED rung: cmpi.w + beq.s not taken
dispatch_hit_cycles    = 18          # code-derived — the matching rung: cmpi.w + beq.s taken
op_tail_cycles         = 10          # code-derived — dbf d0, .op_loop, taken
# SPLIT PER OP CLASS 2026-08-19 (substrate Tier-3 item 1). A burst word is `move.w` + the
# loop's taken `dbf` (10) in both cases; what differs is the destination spelling, which is
# decided by whether the op still holds VDP_CTRL in a2 when it reaches its burst.
stream_word_cram_cycles = 26         # code-derived — move.w (a1)+, -4(a2) 16 + dbf 10  (cram, vsram)
stream_word_deep_cycles = 30         # code-derived — move.w (a2)+, VDP_DATA 20 + dbf 10 (region, restore:
                                     #   a2 is their SOURCE cursor, so the write has no base register)
work_reg_cycles        = 12          # code-derived — move.w (a1)+, (a2)
# SPLIT 2026-08-18 (substrate item 1): the blanking spin is per-op DATA in the program,
# not a constant folded into these rows, so the work terms are now SPINLESS BASES and a
# fixture's work = base + spin_cyc(N) where spin_cyc(n) = n*10 + 14. The count read is
# `move.w (a1)+, d1` (8) where it was `moveq #imm, d1` (4), so each base is +4 on the
# spinless part of its predecessor.
work_cram_cycles_SUPERSEDED    = 90  # folded EFX_BLANK_DELAY=4's spin (54) into the constant
work_region_cycles_SUPERSEDED  = 122 # ditto, + lea 8 + adda.w 12 + lea restore 12
work_restore_cycles_SUPERSEDED = 212 # spinless 64 + EFX_RESTORE_DELAY=13 spin (148)
work_cram_base_cycles    = 40        # code-derived — cmd move.l 20 + spin read 8 + count 8 + tail dbf 4
work_region_base_cycles  = 72        # code-derived — the above + lea 8 + adda.w 12 + lea restore 12
work_restore_base_cycles = 72        # measured — R1's spinless 64 + the 4-cyc stream read
dispatch_rungs         = 5           # code-derived — chain length; OP_SET_REG falls through it
scanline_cycles        = 488         # code-derived — RASTER_SCANLINE_CYC
residual               = 0           # eight fixtures, four free parameters, zero residual
noise_floor_cycles     = 0           # five boots per fixture, spread 0 on all eight
instrument             = "the per-routine row for the HBlank trampoline — NEVER interrupts.hint, which is HBlank + VBlank summed in this ROM"

[raster.op_pal_region]
# A region is a SCOPED colour swap (<= cram_words_per_fire), streamed from a variant's
# Pal_Variant_Stage bytes. A full-line region spreads across ceil(16/3)=6 fires.
max_colours_per_fire = 3             # code-derived — bound by RASTER_CRAM_MAX
handler_extra_cycles = "NEEDS-MEASUREMENT"  # oracle: lea+adda.w+stream vs a plain OP_CRAM
# RENAMED 2026-08-14. This was `full_line_fire_cost`, which read as a CYCLE cost while
# being ceil(16/3) — a LINE COUNT — tagged `code-derived`, i.e. arithmetic wearing a
# measurement's label. It is how many fires a 16-colour line needs, nothing more.
full_line_fire_lines = 6             # code-derived — ceil(16 / 3)
# And the measured consequence: six of them CONSECUTIVELY is refused by the density
# guard, because a 3-colour cram fire is 518 cyc against a 488-cyc line. A full-line
# swap belongs in the dense tier, which stays inside one interrupt.
full_line_consecutive_verdict = "REFUSED — space them, or use the dense tier"

[raster.dense]
# OP_RUN_GRADIENT: fire every line (reg $0A=0), minimal per-line body.
mode = "every-line"
# MEASURED 2026-08-13 (oracle profiler, OJZ section 2, 96-line run = 101 fires/frame).
# Dense H-INT total 41579 cyc/frame (32.5%) vs sparse 8358 (6.5%); the marginal cost of
# the 97 extra fires is (41579-8358)/97 = ~342 cyc/line. That INCLUDES profiler
# instrumentation, autovector entry and rte, so it is an upper bound on the body.
#
# THE 8358 HERE IS DELIBERATE AND STILL VALID — do not "correct" it to the superseded
# marker at :41. Both 41579 and 8358 came off the SAME profiler on the SAME day under
# the SAME instrument bug (oracle's `interrupts.hint` bucket includes VBlank, because
# it classifies by comparing entry PC against $78 and Aeon's IRQ6 vector is a ROM
# address that never matches). This line uses them as a DIFFERENCE, so that constant
# per-frame VBlank contamination CANCELS: 41579-8358 is a clean marginal cost even
# though neither absolute figure is a clean tier cost. What :41 supersedes is the use
# of 8358 as "what the sparse tier costs" — which is not what it is doing here.
# Replacing it with the :44-58 differentials would compare figures from two different
# instruments and silently corrupt the 342.
per_line_body_cycles_upper = 342
dense_run_cycles_per_frame = 41579   # a 96-line run
dense_run_frame_pct        = 32.5
# THE DECISION-RELEVANT FACT: this costs ZERO lag frames. VSync_Wait measured 62.8%
# idle WITH the dense run active vs 62.4% without — i.e. the run is absorbed by
# existing slack, because H-INT time nests inside the idle wait rather than adding to
# a saturated frame. So the reserved-register optimisation (corpus ~26 cyc/line,
# Ruling 4c) is a HEADROOM improvement, not a correctness or lag fix, at this content
# density. Caveat: OJZ_ScrollTest is a near-empty game state; a populated level has
# less idle to absorb it, so re-measure before concluding it is free in real content.
transition_arm_lag_fires = 1         # fixed — one pipelined arm at EACH of enter/leave (Ruling 1b)
# Full-frame every-line cost (rejected for the sparse tier): ~224 * per-fire.
full_frame_fraction_ntsc = 0.76   # measured-derived: 224 lines * 342 cyc / 128000 (upper bound)

[palette]
max_active_variants  = 2             # code-derived — PAL_MAX_VARIANTS (raise only on evidence)
cycle_max_channels   = 4             # code-derived — PAL_CYCLE_MAX_CHANNELS
fade_window_frames   = 16            # code-derived — PAL_FADE_FRAMES
compose_static_frame = "one compare (tst.b Pal_Active)"  # code-derived — early-out, and TRUE again as of the fix below
# RESOLVED 2026-08-13 (fix/palette-variant-derive). The 15.1% figure below WAS real and
# WAS the biggest single cost in the effects suite; it is now ~0.
#
# The early-out was never broken. Pal_Active answers "is a slot bound?", but the derive
# needed "did this layer's input change?" — so a bound-but-static variant recomputed a
# bit-identical staging image every frame. Confirmed on hardware before the fix:
# Pal_Active = $10 (variant-only), with Palette_Buffer AND Pal_Variant_Stage verified
# bit-identical across frames. PAL_ACT_VARIANT_STALE (Pal_Active bit 5) now gates it.
#
# A/B, same scene, same 30 frames, profiler on both shapes of the change:
#   Palette_DeriveVariant  19332 (15.1%) -> absent from top-14 (floor 1095 cyc)
#   Palette_Compose        19568 (15.3%) -> absent
#   VSync_Wait idle        80267 (62.7%) -> 99688 (77.9%)   [+15.2 points]
# Pal_Variant_Stage byte-identical after the fix: same image, ~19.5k fewer cycles.
compose_variant_derive_cycles = 0        # was 19332 — gated; pays only on frames whose source moved
compose_variant_derive_pct    = 0.0      # was 15.1
# The cost when it DOES run (a cycling/fading frame) is unchanged at ~19332 for a
# 3-line variant — 48 entries at ~403 cyc. That is the remaining target if real content
# runs cycling or a fade continuously; the per-channel bind-time LUT (lever C in the
# design) is the answer there, NOT another gate. NEEDS-MEASUREMENT in real content.
compose_variant_derive_when_stale_cycles = 19332
compose_fade_step_cycles      = "NEEDS-MEASUREMENT"  # no fade was armed in the measured captures
palette_compose_total_cycles  = 0        # was 19568 — see above

[raster.schedule_build]
# MEASURED 2026-08-16 on oracle, s4.debug.bin, OJZ section 0, Debug_Scene_Freeze=1,
# Camera_Y=144, both patch anchors written so each record sits mid-band (nothing suppressed —
# the worst case for the builder, since a suppressed record is work it skips). 100-frame
# average, profiler on for both shapes.
#
# The parcel replaced Raster_PatchAll (rewrote one arm BYTE per record in the live buffer)
# with Raster_BuildSchedule (re-records the whole schedule into the inactive buffer and
# swaps). That is what makes a record REMOVABLE; this row is what it costs.
#
#   Raster_PatchAll        372 cyc   ->  Raster_BuildSchedule   1228 cyc   (+856)
#   Raster_VBlank          634       ->                         1490      (+856, consistent)
#   VInt_Level            7499       ->                         8421      (+922, the BRACKET)
#
# VInt_Level is the number that matters, not the proc: Raster_VBlank runs inside the
# sound-ON DMA-flag / sound-OFF z80_stopped bracket, before Flush_VDP_Shadow and every DMA
# drain, on BOTH VInt_Level and VInt_Lag. +922 cyc is ~1.9 scanlines of an ~18,200-cycle
# NTSC VBlank window, and the bracket still sits under half of it.
#
# ZERO HBlank cost: Raster_HInt is byte-for-byte unchanged by this parcel, which is the
# entire reason the re-record shape was chosen over a per-record NEXT link (Ristar's
# spelling would have spent ~12 cycles of a ~60-cycle per-fire budget, forever).
# NOTE: oracle's interrupts.hint counter INCLUDES VBlank, so its movement between these two
# runs is the VBlank delta above, not an HBlank cost. Do not read it as one.
build_schedule_cycles     = 1228     # 2 records, none suppressed
build_schedule_prev_cycles = 372     # Raster_PatchAll, the proc this replaced
vint_level_cycles         = 8421     # the bracket; was 7499
records_measured          = 2

[ram]
# code-derived — the two effects RAM blocks (engine/ram.emp span guards).
palette_state_bytes  = 472           # PALETTE_STATE_SIZE
raster_state_bytes   = 318           # RASTER_STATE_SIZE (Program/Cursor/Pending/Line + Buf_A/Buf_B 128 each + Active_Buf + dense + ramp + Effects_World_Y[4] + Effects_Screen_L[4] + Effects_Offscreen_Entry + Patch_Tab)
                                     # 288 -> 306 in effects-P3 P-b: -4 for the deleted single-channel water pair
                                     # (Raster_Water_Line + Raster_Water_World_Y), +8 for Effects_World_Y[RASTER_MAX_PATCH],
                                     # +4 for Raster_Patch_Tab, +10 for the ramp cells already present but never added here.
variant_stage_bytes  = 256           # PAL_MAX_VARIANTS * 128 (part of palette_state)
free_before_stack_kb = 31.8   # measured — build.sh reports it each build

# ---------------------------------------------------------------------------
# [symbols] — the machine-readable half of the "code-derived" status key. Each entry
# maps a dotted row path above to the .emp constant that is its authority;
# tools/effects_budget_check.py resolves the constant and fails on disagreement.
#
# NOT resolvable, deliberately absent, and recorded here so their absence is not read
# as an oversight: save_set_registers (a `movem` operand, not a constant),
# program_overhead_fires (no symbol exists), full_line_fire_lines (ceil(16/3), computed
# prose), compose_static_frame (prose). The two NEEDS-MEASUREMENT rows are evidence
# gaps, not build gates.
[symbols]
"raster.sparse.cram_words_per_fire"         = "engine/effects/raster.emp:RASTER_CRAM_MAX"
"raster.op_pal_region.max_colours_per_fire" = "engine/effects/raster.emp:RASTER_CRAM_MAX"
"palette.max_active_variants"               = "engine/effects/palette.emp:PAL_MAX_VARIANTS"
"palette.cycle_max_channels"                = "engine/effects/palette.emp:PAL_CYCLE_MAX_CHANNELS"
"palette.fade_window_frames"                = "engine/effects/palette.emp:PAL_FADE_FRAMES"
"ram.palette_state_bytes"                   = "engine/effects/palette.emp:PALETTE_STATE_SIZE"
"ram.raster_state_bytes"                    = "engine/effects/raster.emp:RASTER_STATE_SIZE"
"ram.variant_stage_bytes"                   = "engine/effects/palette.emp:PAL_MAX_VARIANTS * 128"
# The cost model. These are the constants a build-time GUARD divides by, so they are the ones
# where a silent drift between this file and the code costs the most.
"raster.cost_model.fire_base_cycles"        = "engine/effects/raster_dsl.emp:RASTER_FIRE_BASE_CYC"
"raster.cost_model.op_fetch_cycles"         = "engine/effects/raster_dsl.emp:RASTER_OP_FETCH_CYC"
"raster.cost_model.dispatch_rung_cycles"    = "engine/effects/raster_dsl.emp:RASTER_DISPATCH_RUNG_CYC"
"raster.cost_model.dispatch_hit_cycles"     = "engine/effects/raster_dsl.emp:RASTER_DISPATCH_HIT_CYC"
"raster.cost_model.op_tail_cycles"          = "engine/effects/raster_dsl.emp:RASTER_OP_TAIL_CYC"
"raster.cost_model.stream_word_cram_cycles" = "engine/effects/raster_dsl.emp:RASTER_STREAM_WORD_CRAM_CYC"
"raster.cost_model.stream_word_deep_cycles" = "engine/effects/raster_dsl.emp:RASTER_STREAM_WORD_DEEP_CYC"
"raster.cost_model.dispatch_rungs"          = "engine/effects/raster_dsl.emp:RASTER_DISPATCH_RUNGS"
"raster.cost_model.scanline_cycles"         = "engine/effects/raster_dsl.emp:RASTER_SCANLINE_CYC"
# The four class-work constants are private (`const`, not `pub`) in raster_dsl.emp; the
# regex reads them anyway, and they belong here for the same reason as the rest — they are
# the terms that separate a region fire from a cram fire.
"raster.cost_model.work_reg_cycles"         = "engine/effects/raster_dsl.emp:RASTER_WORK_REG_CYC"
"raster.cost_model.work_cram_base_cycles"   = "engine/effects/raster_dsl.emp:RASTER_WORK_CRAM_BASE_CYC"
"raster.cost_model.work_region_base_cycles" = "engine/effects/raster_dsl.emp:RASTER_WORK_REGION_BASE_CYC"
"raster.cost_model.work_restore_base_cycles" = "engine/effects/raster_dsl.emp:RASTER_WORK_RESTORE_BASE_CYC"
