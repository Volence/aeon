cram_words_reason    = "cycle budget, not FIFO. A 26-cycle word x 3 spans 52 of the measured 122.9-cycle window and the solved landing sits 10.9 cyc clear of the early margin, 30.0 clear of the late. FOUR WAS MEASURED AND REFUSED: it passes the fit arithmetic by 14.9 cyc but the spin quantizes to whole dbf iterations and the nearest one leaves 0.9 cyc at the early edge, against a pooled estimator s.e. of 2.0 (tools/hblank_window_sweep.py --words 4). A 16-colour line takes ceil(16/3) = 6 fires"
