max_diagonal_lags = true
max_diagonal_lag_note = "sustained 16px/tick diagonal (13.4 px/video-frame) ticks at ~50 Hz, not 60 (was ~30 Hz before the streaming arc). Measured, reproducible, spread 0. It is a streaming cost (Tile_Cache_Fill 42.4%), not an effects cost -- but every budget expressed per VIDEO FRAME must not assume 60 Hz at this state."

# ---- AXIS 5's DENOMINATOR: the object system's SAT occupancy -----------------
# Scanline P3 Phase 0 Task 4, 2026-08-20. s4.debug.bin crc 5be03175 len 715084.
# tools/engine_baseline_probe.py --sat, FIVE independent boots per state, SPREAD 0 on every
# row of both states, at the SAME two camera states as every row above (idle verified in the
# same session at Camera_X 96 / Camera_Y 144, ENGINE-BASELINE.md §1's definition).
#
# Design §5 prices axis 5 "against a declared object-system reservation" and there was never
# one -- [scene_budget].axis5_sprite_slots read "NO SUBJECT UNTIL P3". These are that
# reservation. Evidence + the binding-ceiling ruling: ENGINE-BASELINE.md §6.
#
# NO NUMBER HERE WAS TYPED. The table base is derived TWICE and required to agree (the shipped
# VRAM_SPRITE_TABLE const, and the LIVE VDP reg-5 shadow byte, which VdpShadow's own note calls
# the authority for $00-$12); the entry stride is sizeof(Sprite_Table_Buffer)/MAX_VDP_SPRITES
# read out of engine/ram.emp; the occupancy is walked from the VRAM link chain and cross-checked
# against Sprites_Rendered AND the Sprite_Table_Buffer RAM image. Three red-first poisons
# (--sat-poison base|chain|ram) each drive their own check red with the control green.
axis5_status = "measured"
axis5_instrument = "ORACLE headless, emulator/read_vram over the SAT; occupancy walked from the link chain. NOT a profiler row -- this axis is a table/scanline occupancy, not cycles."
sat_vram_base = 0xB800               # code-derived: engine/system/constants.emp VRAM_SPRITE_TABLE,
                                     # confirmed against the live VDP reg 5 ($5C << 9)
sat_table_entries = 80               # code-derived: MAX_VDP_SPRITES
sat_entry_bytes = 8                  # derived: Sprite_Table_Buffer 640 B / MAX_VDP_SPRITES
# The per-line pair are DATASHEET constants of the H40 VDP, same class as
# dma_stall.DMA_BYTES_PER_LINE's 205: documented hardware rates, not measurements of this ROM.
h40_sprites_per_line_limit = 20
h40_sprite_pixels_per_line_limit = 320

idle_sat_slots_used            = 3   # of 80 (3.8%) -- 1 test marker + 2 rings
idle_sat_worst_line_sprites    = 2   # of 20 (10.0%), at scanline 5
idle_sat_worst_line_pixels     = 32  # of 320 (10.0%), at scanline 5
idle_sat_lines_with_sprites    = 32  # of 224
idle_sat_mask_sprites          = 0
# MAX-DIAGONAL GIVES AXIS 5 NOTHING, and the row says so rather than reporting 0/80 as
# headroom. The state's ONE poke moves the leader 2000/1400 px ahead of a camera that closes
# 16 px per tick, so the leader is off-camera and culled for the whole window and the entity
# window has left the seeded rings behind. The SAT holds only the hidden terminator entry
# (`.empty_table`, sprites.emp), Sprites_Rendered reads 0, the shipped DMA is 4 words.
max_diagonal_sat_slots_used         = 0
max_diagonal_sat_worst_line_sprites = 0
max_diagonal_sat_worst_line_pixels  = 0
max_diagonal_sat_note = "renders NO sprites: the leader is teleported beyond a camera that never catches it and is culled, and the rings despawn. The SAT carries only the hidden terminator. This is a true reading of the state and NOT an occupancy figure -- axis 5 has exactly ONE informative state, idle."

# WHICH CEILING THE AXIS GATES ON. The per-line SPRITE COUNT, not the 80-entry table.
# Derivation in ENGINE-BASELINE.md §6.2; the short form is that the mask's marginal cost is
# 5% of the per-line sprite ceiling against 1.25% of the table ceiling and 2.5% of the
# per-line pixel ceiling, and the per-line ceiling is the one a clustered scene reaches first
# (the engine spends code on exactly that problem -- Render_Sprites' SCANLINE_SPRITE_LIMIT
# soft band heuristic -- and none on running out of the 80).
axis5_binding_ceiling = "per-line sprite count (20/line, H40)"
axis5_budget_per_line_sprites = 18   # 20 less the 2 measured at idle
axis5_budget_per_line_pixels  = 288  # 320 less the 32 measured at idle
axis5_budget_table_slots      = 77   # 80 less the 3 measured at idle
# THE MASK'S PRICE, derived from the engine's shipped mask emitter rather than assumed.
# InsertSpriteMasks writes 8x32 mask sprites (SPRITE_MASK_SIZE = 1x4 cells, SPRITE_MASK_HEIGHT
# = 32) and rounds coverage UP to whole ones, so covering N scanlines costs ceil(N/32) slots.
# SINCE P3 TASK 12 THESE THREE ROWS ARE GATED, not just recorded:
# tools/effects_budget_check.py's check_axis5_mask_pricing() re-derives all three from the
# shipped constants (SPRITE_MASK_HEIGHT / SPRITE_MASK_SIZE in engine/objects/sprites.emp,
# SB_SCREEN_LINES in engine/level/scene_dsl.emp) on every canonical build and fails on drift.
# SINCE P3 TASK 14 THE AXIS IS ALSO ENFORCED COMPTIME (the enforcement authority per design
# §5's ownership rule): scene_budget_enforce() charges every registry scene on all three
# sub-ceilings from the SB_AXIS5_* transcriptions of the rows above, pinned back to this
# file by the [symbols] rows. See axis5_sprite_slots in [scene_budget].
sat_mask_slot_cost_per_32_lines = 1
sat_mask_slots_full_height      = 7   # ceil(224 / 32) -- NOT 1
sat_mask_pixels_per_line        = 8   # one 8-px column
axis5_task12_resolution = "RESOLVED 2026-08-21 (P3 Task 12), superseding axis5_task12_flag. The flag said: the plan prices the mask at ONE slot, full height is really 7, and Task 12 must accept 7 / bound the height / add a taller primitive -- never silently ship 7 against a budget written for 1. RULING: ACCEPT 7, openly. The axis GATES ON THE PER-LINE SPRITE COUNT (axis5_binding_ceiling), where the column strip costs exactly 1 sprite and 8 px on any scanline REGARDLESS of how many table entries build it -- so the 7-vs-1 discrepancy never touches the binding ceiling, only the table row, where 7 of the 77-slot measured headroom is 9.1%. Bounding the height was rejected because it buys nothing on the binding ceiling and turns a policy into a partial cover; a taller mask primitive was rejected because it would change the shipped InsertSpriteMasks geometry (byte churn in every image) to optimize the axis that does not bind. Enforcement: check_axis5_mask_pricing() in tools/effects_budget_check.py prices every SpriteMask-declaring scene (census over games/*/data/effects/*.emp) against the three axis5_budget_* rows at run time, one scene live at a time (the P2 max ruling); red-first proven both ways (geometry drift 7->1 named the derivation; a planted adopter against a shrunken 3-slot budget named the overrun). Adoption today is ZERO: both shipped per-column families declare Accept, and scene() refuses SpriteMask until its engine emission lands (see DEFERRED_WORK 'Sprite mask for per-column V-scroll' -- the emission is an aeon+sigil pair away, and the mechanism ruling there is an OPAQUE strip at screen X 0, not the VDP X=0 sprite-masking feature, which cannot repaint plane pixels)."
# THE CAVEAT, carried onto the row explicitly per ENGINE-BASELINE.md §5 ("A near-empty game
# state"): 3 of 80 is a FLOOR on occupancy and the 18-sprite/288-px headroom above it is an
# UPPER BOUND, not a promise. GameState_OJZScroll is a scroll test; a populated level runs more
# objects and every one of them lands in the same table and on the same scanlines.
axis5_caveat = "UPPER BOUND ON HEADROOM. Measured on GameState_OJZScroll, a near-empty scroll test whose entire SAT is one debug marker plus two rings. A populated level grows every row here. Do not read 3/80 as the object system's cost -- read it as the cost of a level with almost nothing in it."

[dma_stall]
# AWARENESS ONLY — design §5 carries this NEEDS-MEASUREMENT for awareness, not gating, this
# phase, because it couples to the sound driver's DMA-survival design. Scanline P2 Phase 0
# Task 5, 2026-08-19.
#
# THE ASKED-FOR FIGURE IS UNMEASURABLE ON THIS INSTRUMENT, and that is the row's real content.
# Oracle's 68000 core adds only `cyclesExecuted` to `_currentCycle` (M68000.cpp:1029-1031)
# while bus/VDP/DMA stall accumulates in `additionalTime` and lands in `_currentTime`; the
# profiler ring stamps `_currentCycle` (M68000.h:95). Stall time therefore reaches the wall
# clock and NEVER reaches a cycle row. Any stall figure taken off a cycle row here would be an
# undercount or a zero regardless of what the hardware does -- which is why this row is not a
# number and must not be rendered as 0 or as green.
max_contiguous_dma_stall_cycles = "UNMEASURABLE-ON-THIS-INSTRUMENT"
max_contiguous_dma_stall_mechanism = "oracle's cycle clock excludes bus/VDP/DMA stall by construction: M68000.cpp:1029-1031 adds only cyclesExecuted to _currentCycle, additionalTime goes to _currentTime, and the profiler ring stamps _currentCycle (M68000.h:95)"
max_contiguous_dma_stall_migration = "oracle-next's profiler v1 rows carry stallCycles per routine (registered, in recon 2026-08-19). That is the direct read; re-take this row there."
max_contiguous_dma_stall_note = "couples to the sound driver's DMA-survival design; gating this is a later decision, not P2's"

# THE INDIRECT BOUND, and it is a DERIVATION rather than a measurement of a stall. The 68000 bus
# is held for the whole of a VDP DMA from 68K memory, so the longest contiguous hold in a frame
# is the longest SINGLE DMA the queue carries -- and that length IS readable, from SizeH/SizeL
# in each DMAEntry. tools/engine_baseline_probe.py scans the queue at scanline 220 (inside
# active display, after every main-loop enqueue, before VBlank drains it -- scanning at a frame
# boundary would read an empty queue and report "no stall").
#
# WHAT THE BOUND IS BLIND TO, so it is not over-read: refresh stalls, Z80 bus contention, VDP
# FIFO stalls on ordinary non-DMA port writes, and any DMA issued outside the queue. It bounds
# ONE contributor, and its cycle conversion uses documented hardware rates (H40 VBlank VRAM DMA
# 205 B/line, scanline 3420/7 = 488.57 cyc) rather than anything measured on this ROM.
dma_scan_status = "derived from queue contents, NOT a measured stall"
dma_scan_scanline = 220
#
# ##### THE WHOLE-REGION ROWS BELOW ARE LIVE PLUS RESIDUE. P3 Task 6 Step 1, 2026-08-20. #####
# `Process_DMA_Critical` resets only the slot CURSOR when it drains (dma_queue.emp:362); the
# entry bytes are never zeroed. A scan of [DMA_Queue, DMA_Queue_End) therefore reports earlier
# frames' entries beside the live ones, and the rows first taken that way were read as
# per-frame figures when they are not. Three tells, all reproduced on the day: at scanline 220
# all three slot cursors sat at their BASES (queue EMPTY, so every entry reported was residue);
# the scan listed slot 8 while slots 6 and 7 were absent, which a bump allocator cannot produce;
# and the 576-word entry is identical at both camera states, which is what a frozen leftover
# looks like. The rows are KEPT — a residue union is a real ceiling on what the engine enqueues
# — and RELABELLED, with the live figures beside them.
dma_scan_whole_region_includes_residue = true
dma_max_single_transfer_words = 576     # whole-region: an art-page DMA seen as residue
dma_max_single_transfer_bytes = 1152
dma_max_single_transfer_derived_cycles = 2745.5   # 1152 B at 205 B/line x 488.57 cyc/line
dma_queue_entries_idle = 7
dma_queue_words_idle = 1528
dma_queue_words_max_diagonal = 1519
# ---- the LIVE per-frame queue, bounded by the three slot cursors (2026-08-20) ----
# Taken two independent ways that agree exactly: cursor-bounded at the scan instant, and by
# zeroing the region while it was provably all residue and advancing exactly one frame. Both
# give the same four entries: two CRAM palette lines, the SAT, and ONE HScroll.
dma_live_entries_idle = 4
dma_live_words_idle = 492               # 984 B: 32 + 32 + 24 (SAT) + 896 (HScroll)
dma_live_entries_max_diagonal = 4
dma_live_words_max_diagonal = 483       # 966 B — same four entries, a smaller SAT
dma_live_max_single_transfer_words = 448   # the HScroll entry IS the largest live transfer
# ONE ENTRY, NOT TWO. The scan that saw "two 448-word entries with the same command word
# $7C000082" (and a matching duplicated pair of 24-byte SAT entries) was seeing one live entry
# and one stale copy at a different slot offset, because the palette-dirty count differed
# between the two frames. The tree has exactly ONE `queue_static_dma(Static_Hscroll_Line)` site
# (engine/system/buffers.emp), it is an either/or with the per-cell arm, and it is reached once
# per VBlank. Isolated measurement: one 896 B entry, five trials, no variation.
dma_hscroll_perline_entries = 1
dma_hscroll_perline_bytes_each = 896

[parallax.cost_model]
# THE WALKER'S FITTED ADDITIVE MODEL — design §5 axis 1. Scanline P2 Phase 0 Task 4 (original),
# RE-MEASURED AND SUPERSEDED by Scanline P3 Phase 0 Task 1 (2026-08-20), RE-TAKEN AND
# PROMOTED by Scanline P3 Task 13, 2026-08-22, over the walker P3 leaves behind (T1-T12
# landed; ROM s4.debug.bin crc 0dbaa80f len 715010, the canonical debug tip).
# tools/parallax_cost_probe.py, 26 fixtures + 1 out-of-sample row, 3 boots each, spread 0 on
# every one, every window preemption-free. Evidence + derivation:
# docs/benchmarks/scanline-p2/WALKER-MODEL.md (§11 is the Task 13 promotion run).
#
# THE TASK 13 FINDING, one line: the tip fit reproduces the T7 `reglue_*` staging rows to
# the printed precision on every column, both anchor terms, and the out-of-sample row —
# T8/T9/T10/T11/T12's canonical-image halves were comptime, exactly as their landings
# claimed, so the walker has not moved since T7's world-Y re-glue.
#
# ##### EVERY P2 ROW WAS DILUTED BY 30/31 AND IS NOW REPLACED. #####
# The per-routine row is a per-VIDEO-FRAME average, so it is one Parallax_Update call only while
# the main loop completes one logic tick per video frame. The P2 sweep did not check that and the
# idle baseline lags roughly one window in four (plus always on the window right after a fixture
# install), so every P2 coefficient was ~3.3% low and `line_both` — excited by ONE fixture, whose
# window caught TWO lag frames — was ~7% low. The probe now brackets the profiled window with
# Frame_Counter/Logic_Tick and re-takes it until they agree. WALKER-MODEL.md §0(a) has the
# coefficient-by-coefficient ratio table that proves the factor is exactly 30/31.
#
# The 748-cycle "second anchor regime" P2 recorded was this dilution (W10/W12 caught two lag
# frames while the model fitted to them caught one) plus a genuinely missing per-line term (the
# deform SHIFT value). Reconstructing the published numbers from the clean model through both
# distortions reproduces W16's +1204.7 to 0.4 cycles. See WALKER-MODEL.md §5(c).
#
# The response is `Parallax_Update`'s per-routine row, INCLUSIVE of its callees (verified:
# it contains Parallax_Fill_PerLine and Decode_Factor_A/B). Camera FROZEN, so every video
# frame carries exactly one complete call -- under motion the loop lags and a per-frame
# average stops being one call (ENGINE-BASELINE.md §2).
#
#   cycles = base                                 [the per-line floor — see base_cycles]
#          + band_perline x (bands-1)
#          + multiband  (bands >= 2, once)
#          + line_fg_only x LINES + line_bg_only x LINES + line_both x LINES   [at shift 0]
#          + shift_lines x SUM(deform shift over sampled channel-lines)
#          + band_sampling x (bands taking a sampling loop rather than .lp_flat)
#          + vdeform    (a V-deform table attached)
#          + anchor + anchor_ops x (Step-4b overlay loop trips)
#
# THE SAMPLING TERMS ARE PER SCREEN LINE, not per channel. That unit was forced by
# measurement, not chosen: fixtures that sample only their lower band (112 and 80 lines)
# give marginal costs of 8820/112 and 6300/80 against 17640/224 -- 78.75 every time. A
# per-channel constant fits the fixtures that sample everywhere and then over-charges real
# content, which samples only below an anchored split.
#
# AND THEY ARE PER SHIFT UNIT. The sampled loops end in `asr.w d3, d1`, a REGISTER-count shift
# (6 + 2n on the 68000), so the per-line columns below are the shift-ZERO intercepts and
# shift_lines carries the amplitude. Measured 2.0000 on both steps (shift 2->3 over 224 lines
# = 448; shift 3->5 over 224 lines = 896) -- a derived constant the fixtures confirmed exactly.
# P2 had no such column, so its per-line rows were the shift-3 values dressed as constants,
# and the SHIPPED config samples at shift 2.
status = "measured"
instrument = "ORACLE per-routine row for Parallax_Update, inclusive; camera frozen; window verified PREEMPTION-FREE (frames/tick 31/31, lag 0) and re-taken until it is; interrupts.hint never read. IDEAL-CYCLE (the clock excludes bus/VDP/DMA stall)"
loop_shape = "POST-UNROLL per-line filler + P3 world-Y re-glue (Step 4a rotates in plane LINES), at the P3 tip (T1-T12). Every row is a property of THAT code; the next parcel that touches a Parallax_* routine re-measures per the P3 standing rule rather than carrying them"
fixtures = 26
residual_cycles = 0.00               # max |residual|, UN-ANCHORED subset (18 fixtures)
residual_cycles_all_fixtures = 43.6  # all 26, both anchor columns live (W13 −43.6; the
                                     # anchored fixtures carry the recorded loop-type spread)
residual_cycles_overlay_term = 58.9  # the 2-parameter anchor fit over the 8 anchored fixtures
noise_floor_cycles = 0               # 3 boots per fixture, spread 0 on all 26

# THE PER-CELL PATH WAS DELETED 2026-08-26 (owner ruling d-29-corrected; docs/DEFERRED_WORK.md
# "Per-cell HScroll fill — DELETED"). Three rows stood here for it:
#     base_cycles          = 3116.00   # W0 — 1 band, per-cell, nothing on
#     band_percell_cycles  = 752.00    # W0->W1->W2->W3
#     line_mode_cycles     = 1548.00   # W0->W4: a table attached at all — selected
#                                      # Parallax_Fill_PerLine over _PerCell AND flipped reg $0B
# `band_percell` has no subject any more. `base` and `line_mode` only ever appear SUMMED
# now (every config pays both), so the floor below is their DERIVED sum, not a re-take:
