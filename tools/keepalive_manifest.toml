#  keepalive_manifest — the declared invocation list for tools/keepalive_lane.py
#
#  WHY DECLARED AND NOT DISCOVERED. Each bus instrument has its own arguments and its own
#  idea of success. A runner that auto-discovered them and guessed would produce noise,
#  and a noisy lane gets ignored -- which is the dead-instrument defect again with extra
#  steps. So every tool the lane runs gets one line here saying HOW to invoke it and WHAT
#  its exit status means, and every tool the lane does NOT run gets one line saying why.
#
#  EVERY BUS INSTRUMENT IN THE TREE MUST APPEAR IN EXACTLY ONE OF THE TWO SECTIONS.
#  keepalive_lane.py derives the population from the tree on every run (see
#  keepalive_population.py) and reports COULD NOT RUN if any name is undeclared here, or
#  if any name here has left the tree. A keepalive lane quietly covering 84 of 85 is the
#  artifact it was built to prevent, so the accounting is checked rather than intended.
#  ⚠ CORRECTED 2026-09-25 (CENSUS-CRITERION-TOO-NARROW): "bus instrument" meant "names
#  BusClient" (85). The population is now every tools/*.py that DRIVES a headless emulator,
#  read off its code (90 on 2026-09-25; keepalive_population.drives). Six drivers joined
#  it (effects_gates, cart_identity, depth_onset_probe, cart_verify_spawn_proof,
#  base_swap_witness, staging_lifetime_timeline) and one non-driver left it
#  (cart_coverage_census, a static AST census that drives nothing).
#
#  PLACEHOLDERS: {rom} {lst} {repo} {outdir}. {outdir} is a fresh temp directory made per
#  tool per run -- it is how a capture tool is kept from writing over committed evidence.
#
#  expect = the tool's DECLARED BASELINE exit status, i.e. what it does TODAY when it is
#  working. It is usually 0. Where it is not, the note says why, and that red is the
#  declared state rather than a bug the lane papers over. A tool declared `expect = 1`
#  that starts exiting 0 is reported FAILED, deliberately: a known-red going green is a
#  change in what the instrument reports, and if the lane rounded it to green then the
#  cheapest way to turn this lane green would be to weaken an instrument until it stops
#  complaining.
#
#  timeout = seconds. A timeout is COULD NOT RUN, not FAILED.
#
#  ===================================================================================
#  A ROW IS AN INVOCATION, NOT A TOOL -- and `expect` belongs to the ROW
#  ===================================================================================
#  A key is `tool.py` or `tool.py#arm-label`. Only the part before the `#` names a file;
#  the label names one more declared invocation of the SAME tool. The population
#  accounting folds every row through that split, so N arms of one tool are still ONE
#  disposition, and two rows of one tool with IDENTICAL `args` are reported AMBIGUOUS --
#  two baselines for one measurement, with nothing to say which is the measured one.
#
#  A NON-ZERO `expect` MUST CARRY `baseline_args`, SPELLED OUT AND EQUAL TO THIS ROW'S
#  `args`. The redundancy is the check. Measured 2026-09-19: `loop_step_over_witness
#  --phase-sweep` enters its arm, hits the same tool-wide SETUP red the default arm hits,
#  exits 1, and against a TOOL-keyed `expect = 1` grades PASSED -- a row that reports
#  PASSED whatever it does. A baseline is a measurement of ONE argv; this field is where
#  the row says WHICH, and a row whose baseline names a different argv than it runs is
#  COULD NOT RUN (not PASSED, not FAILED) and is not even spawned.
#
#  `expect = 0` is exempt and that is deliberate: zero is not a measurement that can
#  travel, it is "this tool is supposed to work". The hazard is a measured RED carried
#  onto an arm nobody measured. A zero row that carries `baseline_args` anyway is still
#  held to the equality, so a stale one cannot sit there looking like evidence.

# =====================================================================================
#  WIRED -- the lane runs these
# =====================================================================================

