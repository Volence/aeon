# engine/baseline.toml: the engine's contract-closure baseline rows.
#
# G0b description (`BaselineDesc` in sigil `crates/sigil-build/src/describe.rs`),
# read by every `sigil build --project` contract gate since the cutovers (G0b Tasks
# 8 and 10). Transcribed from sigil b0e63d71
# `crates/sigil-harness/src/contract_baseline.rs`, which kept the reasoning for
# every row there (do not re-adjudicate here; G0b Task 11 deleted those tables, so
# the `contract_baseline.rs:<line>` cites below are AT b0e63d71).
#
# The split is mostly by where the proc lives (engine rows here, game rows in the
# game's baseline.toml); a game may also carry an engine-proc row its build fires. A shape's
# gate is the multiset union of this file and its game's file, plus `d1c_debug`
# on a debug shape. The closure analyses the engine root plus the shape's own
# game root (G0b Task 9a, `Project::closure_roots`), never the other game's
# sources, so a demo shape fires only engine and demo rows.

format = 2

