# What sigil's sound bank-id check reads (`crates/sigil-harness/src/sound_bank_ids.rs`;
# it held these as Rust literals until G0b Task 11 deleted them, and the row cites below
# are to that file at b0e63d71), checked on every sound-on build. The labels here
# (and in [[sound.blob_bank_ids]] banks) are GAME-DEFINED labels the sound engine
# requires when sound is on: a sound-on game's layout must carry every one
# (blob_start/blob_end are the engine's own, engine/system/boot_data.emp; the dac_*
# and bank labels are the game's, games/sonic4/data/sound/). They sit here rather
# than in required_labels because [sound] carries the sound-on condition that
# required_labels lacks (controller ruling M4, G0b Task 2).
[sound]
blob_start = "Z80_Sound_Start"            # sound_bank_ids.rs:45 (BLOB_START, engine/system/boot_data.emp)
blob_end = "Z80_Sound_End"                # sound_bank_ids.rs:46 (BLOB_END)
dac_head = "DacSampleTable"               # sound_bank_ids.rs:48 (DAC_HEAD)
dac_blip_bank = "Dac_Temp_Blip"           # sound_bank_ids.rs:50 (DAC_BLIP_BANK)
dac_shared_bank = "Dac_SharedBank_Start"  # sound_bank_ids.rs:51 (DAC_SHARED_BANK)

# sound_bank_ids.rs:30 (BLOB_BANK_ID_CONSTS, 2 rows) with the labels each must
# bank, sound_bank_ids.rs:36-42 (blob_const_bank_labels).
[[sound.blob_bank_ids]]
name = "SND_ENGINE_TABLE_BANK"
banks = ["SoundTablesZ80_Head"]

[[sound.blob_bank_ids]]
name = "SFX_BLOB_BANK"
banks = ["SfxBlobWinTab", "Sfx_33"]
