# engine/engine.toml: what is true for EVERY game built on the Aeon engine.
#
# G0b (Empyrean v2 step 0) description, read by sigil's `sigil-build` crate
# (`crates/sigil-build/src/describe.rs`, `EngineDesc`): every `sigil build
# --project` of a game on this engine builds from it. The profile-driven driver
# that held these facts in Rust is deleted (G0b Task 11). The rows written in
# G0b Task 2 were transcribed from that Rust at sigil b0e63d71 and cite their
# source there as `<file>:<line>` (files under `crates/sigil-harness/src/`, at
# that revision); rows added later say where they came from.
#
# Paths here are relative to this directory (the engine root). A game names
# this engine by suite path (`[engine] suite_path = "aeon"`), never by a path.
#
# Not here, on purpose: the sound seams' driver files, generated names, driver
# constant names and bank chain heads (they stay in Rust until G0c, owner Q3),
# the frozen size tables, the `SIGIL_EMP_*` AS definedness defines and the
# 68000 even-base rule (port history / an ISA fact the driver owns).

format = 2

# The pure-comptime helper modules, IN ORDER: the later helper silently wins a
# duplicate name, so the order is the fact. native.rs:1930-1951 (COMPTIME_HELPERS, 14 rows).
helpers = [
    "engine.types",
    "engine.coords",
    "engine.constants",
    "engine.structs",
    "engine.objects.sst",
    "engine.objects.aabb",
    "engine.objects.frames",
    "engine.objects.objdef",
    "engine.vdp",
    "engine.irq",
    "engine.z80_bus",
    "engine.level.parallax_dsl",
    "engine.effects.palette_dsl",
    "engine.effects.raster_dsl",
]

# The helpers the focused RAM-address harvest publishes. native.rs:1108-1114 (RAM_HELPERS, 5 rows).
ram_helpers = [
    "engine.types",
    "engine.coords",
    "engine.constants",
    "engine.structs",
    "engine.objects.sst",
]

# (file, struct, AS prefix): the struct twins whose offsets the residual AS reads.
# native.rs:992-1001 (STRUCT_OFFSET_TWINS, 8 rows; files there are aeon-relative
# `engine/...`, here engine-root-relative).
struct_twins = [
    ["structs.emp", "Act", "Act"],
    ["structs.emp", "Sec", "Sec"],
    ["structs.emp", "DMAEntry", "DMAEntry"],
    ["structs.emp", "parallax_config", "parallax_config"],
    ["structs.emp", "VdpShadow", "VDP_Shadow"],
    ["objects/sst.emp", "Sst", "SST"],
    ["objects/entity_window.emp", "EntityScanState", "EntityScanState"],
    ["level/parallax.emp", "band_entry", "band_entry"],
]

# The engine's synthetic-entry seeds. native.rs:1874 (`let seeds`: contract,
# game manifest, engine RAM, game RAM; the game's two come from its [entry]).
entry_seeds = ["engine.game_contract", "engine.ram"]

# The ROM terminus, rooted in every build. module_roots.rs:183 (ENGINE_TERMINUS).
terminus = "engine.epilogue"

# The fault-handler arms. module_roots.rs:168 (ERROR_HANDLER_MODULE_ID),
# module_roots.rs:171 (RELEASE_FAULT_MODULE_ID).
error_handler = "engine.debug.error_handler"
release_fault = "engine.system.release_fault"

# The label the vendored MD Debugger blob is emitted under. native.rs:4839 (ERROR_HANDLER_BLOB_LABEL).
error_handler_blob = "ErrorHandlerBlob"
# The vendored blob's length: the deb2 appendix starts at error_handler_blob + this
# (two `lea`s baked into the blob point there). sigil appendix.rs ERROR_HANDLER_BLOB_LEN.
error_handler_blob_len = 0xF56
# The symbol-table tool the deb2 appendix runs, relative to this engine root.
convsym = "../tools/convsym"

# The fault-handler island heads (release / debug) that fixture placement
# inserts its relocated sections before. native.rs:3384.
fault_island_heads = ["ReleaseFault", "BusError"]

# The defines the residual AS side (each game's game_root.asm) receives, = 1 on a
# shape whose features satisfy `when`. game_root.asm includes the MD Debugger glue
# under `ifdef __MDDBG__`, exactly when the error_handler island is placed.
# Moved from sigil-build driver.rs (`assemble_as`) by G0b Task 11.
# These exist only while the residual AS does; the table goes when `game_root.asm` goes.
as_feature_defines = [
    { name = "SOUND_DRIVER_ENABLED", when = "sound" },
    { name = "__DEBUG__", when = "debug" },
    { name = "__MDDBG__", when = "debug || crash_report" },
]

# The RAM floor: the focused RAM harvest hands the residual AS every label and
# equate of a section placed at or above it (aeon's RAM sections sit at the
# sign-extended $FFFF0000 and up). Moved from driver.rs by G0b Task 11.
ram_floor = 0xF00000

# Residual-AS equates derived from a struct twin's size: SST_interact is the last
# word of the object slot (objects/sst.emp `interact_off()` = sizeof(Sst) - 2).
# Moved from driver.rs (`struct_offsets`) by G0b Task 11.
struct_tail_equates = [
    { name = "SST_interact", of = "Sst", from_end = 2 },
]

# Labels the driver reads out of every build's layout. native.rs:4586
# (`sigil_native_symbol_listing`: EndOfRom absent from the resolved layout is an
# error). EndOfRom is engine/system/epilogue.emp's.
required_labels = ["EndOfRom"]

# Comptime constants the ENGINE's own sources name by bare name and EVERY game must
# declare, as a `pub const` in the game's sources. No default: a game that leaves one
# out is refused by name before anything reads it (sigil-build
# `driver::check_required_consts`, G0b Task 9a), so each game states its value rather
# than inheriting one by accident or resolving it from another game's sources.
#   SFXID_REV_LOOP: the rev-loop SFX id engine/sound/sound_sfx.emp `Sfx_BeginSound`
#   compares against (`if SFXID_REV_LOOP >= 0`); -1 = feature off.
required_consts = ["SFXID_REV_LOOP"]

# The harvest sources. native.rs:918 (harvest_engine_constants reads
# engine/system/constants.emp); native.rs:1022 (harvest_engine_struct_offsets
# reads engine/system/types.emp as the type environment).
constants = "system/constants.emp"
types = "system/types.emp"

# The engine's contract-closure baseline rows.
baseline = "baseline.toml"

# Engine comptime defines every game builds with, at the default every Rust
# profile of both games carries (a game's shape overrides one).
[defines]
SOUND_DEBUG_HOTKEYS = 0  # native.rs:335 (sonic4), :388 (demo), :434, :534; 1 only in config A (:482)
SOUND_DBG_MIRROR = 0     # native.rs:336, :389, :435, :535; 1 only in config A (:483)
STRESS_EVICT = 0         # native.rs:344, :391, :437, :485, :537; 1 only in stress-evict (:566-574)

# Alignment stronger than "even" for an ENGINE label. ObjCodeBase is defined in
# engine/objects/objcodebase.emp. section_align.rs:142 (aeon R1 ruling 2026-08-26).
[[align]]
label = "ObjCodeBase"
align = 0x10000

# The engine rows of the shape gates. module_roots.rs:129-165 (SHAPE_GATES:
# 6 engine rows of 23). ShapeGate meanings: module_roots.rs:113-124.
[[gate]]
modules = "engine.compression_selftest"   # module_roots.rs:133, ShapeGate::Debug
place_in = { feature = "debug" }

[[gate]]
modules = "engine.debug.error_handler"    # module_roots.rs:146, ShapeGate::FaultIsland
place_in = { feature = "debug || crash_report" }

[[gate]]
modules = "engine.system.release_fault"   # module_roots.rs:147, ShapeGate::LeanFault
place_in = { feature = "!(debug || crash_report)" }

[[gate]]
modules = "engine.sound_api"              # module_roots.rs:149, ShapeGate::SoundOn
place_in = { feature = "sound" }

[[gate]]
modules = "engine.z80_init"               # module_roots.rs:161, ShapeGate::SoundOff
place_in = { feature = "!sound" }

[[gate]]
modules = "engine.debug.sound_debug"      # module_roots.rs:164, ShapeGate::SoundDbgMirror
place_in = { feature = "SOUND_DBG_MIRROR" }

