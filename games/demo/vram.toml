# games/demo/vram.toml — the demo game's VRAM contract. The engine regions are
# identical to sonic4's by construction (same engine); the game-side band
# differs, ON PURPOSE now instead of by coincidence.

[[region]]
name = "fg_art_pool"
owner = "engine.level.page_cache"
kind = "arena"
base = 0
tiles = 768                      # follows the engine-global POOL_TILE_CEILING
quantum = 64                     # (960 -> 896, the sonic4 dust carve; -> 768,
                                 # EFFECTS-W1 item 0's spare nametable). The engine
                                 # constant is shared, so every game's map moves
                                 # with it — demo has no dust, so the page the dust
                                 # carve freed is simply declared free below.
lifetime = "act"
authority = "engine-endtiles:POOL_TILE_CEILING"
# demo ships HAS_ACT_ART_POOL=0 — the range exists, unpopulated.

[[region]]
name = "spare_nametable"
owner = "engine.system.boot"
kind = "plane"
base = 768                       # byte $6000, the one $2000-aligned run item 0
tiles = 128                      # bought. ENGINE-owned, so it is declared here too:
lifetime = "boot"                # the engine regions are identical to sonic4's by
                                 # construction, and a consumer that rebases a plane
                                 # base register is engine code both games run.
                                 # No `register` field until a consumer wires one.

[[region]]
name = "demo_obj"
owner = "games.demo.demo_state"
kind = "window"
base = 992
tiles = 4
lifetime = "boot"
const = "VRAM_DEMO_OBJ"

[[region]]
name = "ring_placeholder"
owner = "engine.objects.rings"
kind = "window"
base = 996
tiles = 1
lifetime = "boot"
authority = "sigil-D:VRAM_RING_PLACEHOLDER"

[[free]]
base = 997
tiles = 27

[[free]]
base = 896
tiles = 96
# no dust and no character window in demo — the surrendered pool page (896-959)
# and the band sonic4 uses for the player (960-991) are both free here

[[region]]
name = "bg_region"
owner = "engine.bg"
kind = "arena"
base = 1024
tiles = 400
lifetime = "act"
authority = ["engine-tiles:BG_TILE_CAPACITY", "engine-bytebase:BG_TILE_BASE_VRAM"]
# 448 -> 400 (EFFECTS-W1 item 9d, 2026-09-04). THIS IS NOT A DEMO DECISION — it
# is forced, and the forcing is worth stating because the next person to read this
# will want to put it back. `BG_TILE_CAPACITY` is ONE engine-wide constant
# (engine/system/constants.emp) and BOTH games' `engine-tiles:` authority lines
# cross-check against it, so the two maps cannot declare different bg_region sizes:
# sonic4 carving `waterline_strips` out of its own reserve moves the shared number.
# Demo ships NO background art at all (it has no BG blob and no act to load one
# from), so the 48 tiles cost it nothing; they are declared [[free]] below rather
# than named, because nothing in demo owns them.

[[free]]
base = 1424
tiles = 48
# the 48 tiles sonic4 spends on `waterline_strips` (games/sonic4/vram.toml). Free
# here: demo has no waterline, no row remap (it declares no CAP_ROW_REMAP) and no
# BG art. Declared rather than left as a coverage gap because gen_vram_map.py
# requires every one of tiles 0..2047 to be a region or a DECLARED free run.

[[region]]
name = "sprite_table"
owner = "engine.system.buffers"
kind = "table"
base = 1472
tiles = 20
lifetime = "boot"
register = "vdp:0x05"
authority = "engine-bytebase:VRAM_SPRITE_TABLE"

[[free]]
base = 1492
tiles = 12

[[region]]
name = "hscroll_table"
owner = "engine.system.buffers"
kind = "table"
base = 1504
tiles = 28
lifetime = "boot"
register = "vdp:0x0D"
authority = "engine-bytebase:VRAM_HSCROLL_TABLE"

[[free]]
base = 1532
tiles = 4

[[region]]
name = "plane_a"
owner = "engine.system.boot"
kind = "plane"
base = 1536
tiles = 256
lifetime = "boot"
register = "vdp:0x02"
authority = "engine-bytebase:VRAM_PLANE_A"

[[region]]
name = "plane_b"
owner = "engine.system.boot"
kind = "plane"
base = 1792
tiles = 256
lifetime = "boot"
register = "vdp:0x04"
authority = "engine-bytebase:VRAM_PLANE_B"

[[region]]
name = "window_plane"
owner = "engine.system.boot"
kind = "plane"
base = 1920
tiles = 128
lifetime = "boot"
register = "vdp:0x03"
overlay_with = ["plane_b"]
authority = "engine-bytebase:VRAM_WINDOW"
