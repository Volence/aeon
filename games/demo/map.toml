# Demo placement map — the DECLARED ROM placement contract (Parcel K1).
#
# The minimal template a new game author reads: two anchors (boot head + object bank),
# the sound-OFF Z80-idle hole, the object-bank budget, and the byte-emitting order.
# Covers demo + demo_debug (debug adds CompressionSelfTest). Both are sound-OFF.
# See games/sonic4/map.toml for the fuller (sound-on) shape and the format rationale.

fill = 0x00

# Byte-emitting section order (root array — precedes the [[table]] sections below).
# Each demo target's derived order is a subsequence; a derivation change fails loud.
# Fault-handler shape split (review item 29 part 4): demo (release) places ReleaseFault
# and not the error_handler island; demo_debug places BusError.. and not ReleaseFault.
# Both sit in this union consecutively (no target carries both). NullInterrupt is deleted.
order = [
  "Vectors", "GameHeader", "EntryPoint", "BootData",
  "Z80_IdleProgram", "BootData_PostBlob",
  "VDP_Shadow_Init", "Init_DMA_Queue", "Init_SpriteTable", "VBlank_Handler",
  "HBlank_Install", "Read_Controllers", "GameLoop", "Input_Tick", "S4LZ_DecompressDict",
  "ZX0R_Decompress", "GetSineCosine", "Perform_DPLC", "InitObjectRAM",
  "InitSpriteSystem", "AnimateSprite", "TouchResponse", "RingBuffer_Add",
  "Collected_Init", "PopulateSpawnedPieceCount", "Load_Object", "Plane_Buffer_Reset",
  "Tile_Cache_GetTile", "Collision_GetType", "Section_Init", "Camera_Init",
  "Parallax_Init", "Raster_Install", "Palette_LoadPal", "Effects_ResolveParallax", "Effects_InstallPreset", "Level_LoadArt", "PageIn_Process", "PageCache_Init", "BG_Init", "BgAnim_Init",
  "CompressionSelfTest", "ObjCodeBase", "DemoBox_Main", "ObjDef_DemoBox",
  "GameState_Demo_Init", "ReleaseFault", "BusError",
]

[[region]]
name = "rom"
lma_base = 0
size = 0x400000
kind = "rom"

[[region]]
name = "object_bank"
lma_base = 0x10000
size = 0x10000
kind = "object_bank"

# K5: demo is sound-OFF, so it declares no Z80 Moving-Trucks bank (the region existed only
# to mirror the retired sigil.map.toml's region set; nothing places there — its removal is
# byte-neutral, the demo ROM ends well before 0x60000).

[[anchor]]
name = "boot_head"
at = 0x0

[[anchor]]
name = "object_bank"
at = 0x10000

[[hole]]
after = "Z80_IdleProgram"
at = 0x3F0   # the idle packs flush after boot_head (0x3C8 plain / 0x3CC debug, 40 B); post-hole data resumes at 0x3F0 plain / 0x3F4 debug — this row is the LOWER bound across the sound-off shapes
filled_by = "engine.z80_init"
when = "sound_off"

# `cursor` = the first section past the object bank (the demo's data-region head); its
# resolved LMA is the used-cursor (the map-owned successor to the retired `__BUDGET_DATA`).
[[budget]]
region = "object_bank"
ceiling = 0x20000
cursor = "ObjDef_DemoBox"

# ── Game→engine comptime defines ──
# sigil merges these rows into both demo shapes' define env (crates/sigil-harness/src/
# game_defines.rs). A new game copies this table: the engine reads GAME_SCANLINE_CAPS
# unconditionally, so a game without the row fails with `unknown name GAME_SCANLINE_CAPS`.
#
# GAME_SCANLINE_CAPS is this game's `Game.SCANLINE_CAPS` as a build define, which is what lets
# the engine size its parallax band records and reservations PER GAME (see the same block in
# games/sonic4/map.toml for why a define and not the contract member). Demo's mask is the fold
# of its empty scene registry (games/demo/config/game.emp), so 0: demo's band record is the
# legacy 10-byte entry and it reserves no capability tail. engine/level/parallax.emp refuses
# the build unless this equals Game.SCANLINE_CAPS exactly, in both directions.
[defines]
GAME_SCANLINE_CAPS = 0
