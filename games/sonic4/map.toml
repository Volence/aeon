size = 0x400000
kind = "rom"

[[region]]
name = "object_bank"
lma_base = 0x10000
size = 0x10000
kind = "object_bank"

# The $8000-window phase bank the engine tables + Moving Trucks + the SFX block
# share (LMA = the `sound_bank` anchor below, VMA $8000). DESCRIPTIVE ONLY, measured
# 2026-08-26: no sigil consumer reads a `z80_bank` region (`RegionKind::Z80Bank` is
# constructed by the map loader and matched by nothing; `region_for` considers `rom`
# regions only) — the phase bank's placement authority is the `sound_bank` anchor.
# Was `z80_moving_trucks_bank @ 0x60000`, a leftover from when the MT bank had its own
# $8000 window at $60000 (retired with the $58000 fold, see sigil golden/PROVENANCE.md);
# by 2026-08-26 that LMA sat in the middle of `Map_Tails`, which nothing noticed —
# the proof it is inert. Renamed + moved with the anchor so the map stops lying.
[[region]]
