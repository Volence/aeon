at = 0x10000

# ── BANK PLACEMENT RULE (ROM re-layout, owner ruling d-28-answered option 2,
#    2026-08-26 — restores the 12,288 B BG-animation guarantee in every shape and makes
#    it independent of Sonic's art size) ──
#
# The Z80 banks sit AFTER the data region instead of capping it. Their LMAs are
# DERIVED from the packed-data end, not hardware-fixed; what IS fixed is their
# alignment (0x8000: one Z80 `SetBank` window) and their order (blip bank, shared
# drum bank, then the $8000-window head bank), and the bank ids must stay derivable
# (`bankid()` = (lma & $7F8000) >> 15, folded at link — nothing hand-typed).
#
#   packed_data_end(shape) = LMA(Art_Sonic) + len(art/optimized/characters/sonic.bin)
#                            read from that shape's sigil listing (`Art_Sonic` is the
#                            LAST packed blob before the banks by `order`, above)
#   DATA_GROWTH_RESERVE    = 0xC000  (49,152 B — the floor the gate DEMANDS stays
#                            free; raised from 0x4000 on 2026-09-04, derivation below)
#   DATA_GROWTH_GRACE      = 0x8000  (32,768 B, one SetBank window — the growth the
#                            layout is GUARANTEED to absorb before the gate re-fires;
#                            added 2026-09-04, reason below)
#   dac_banks  = align_up(max over the sound-on shapes of packed_data_end
#                         + DATA_GROWTH_RESERVE + DATA_GROWTH_GRACE, 0x8000)
#   sound_bank = dac_banks + 2 × 0x8000   (blip bank @ dac_banks, shared bank @
#                                          dac_banks + 0x8000 via the intra-section
#                                          `align $8000`, head bank next)
#
# ── WHY THE RULE GREW A SECOND TERM (2026-09-04) ──
# The 08-26 rule was `align_up(packed_end + RESERVE)` and the gate fails when the
# room drops under RESERVE. So the growth the tree may absorb before the gate fires
# again is `align_up(end + R) - end - R` = the align_up REMAINDER — a lottery on
# `end mod 0x8000`, uniform on [0, 0x8000). **Raising RESERVE alone does not raise
# it**: the demand and the anchor move together (measured: at end 0x8C01E, R=0x4000
# and R=0x8000 both give dac_banks 0x98000, with 16,354 B and 0 B of grace). 08-26
# drew 6,368 B of grace; content ate it in 8.2 days and the gate re-fired 30 B under
# the reserve. GRACE sits INSIDE the align_up and outside the gate's threshold, so
# the room is `>= RESERVE + GRACE` and the recurrence period is bounded below by
# GRACE rather than by the draw.
#
# ── WHERE 0xC000 COMES FROM (measured, not chosen round) ──
#   The 08-26..09-04 cycle is the only complete cycle this rule has had. Measured
#   from the two shapes' own listings at each end (DEBUG binds both times):
#     packed_data_end  0x8A720 (08-26, the re-layout report)  ->  0x8C01E (09-04)
#                      = 6,398 B in 8.2 days = 780 B/day, split
#                        +2,814 B data ahead of Art_Sonic  and
#                        +3,584 B art/optimized/characters/sonic.bin itself.
#   RESERVE must still hold the d-28 BG-animation guarantee (16,384 B = two 8 KB
#   bands per act) AND a normal working cycle on top of it:
#     16,384 + 30 days x 780 B/day = 16,384 + 23,400 = 39,784
#     -> rounded up to the reserve's own 0x4000 quantum = 0xC000 = 49,152 B.
#   That the room has already cost real content is on the record: a 58-tile first
#   cut of the perspective floor was BACKED OUT because 1,856 B of art pushed
#   Art_Sonic past this reserve (games/sonic4/vram.toml, the floor-reserve note).
#
# Applied 2026-09-04 (this parcel — the report in
# docs/superpowers/2026-09-04-rom-relayout-more-room-report.md carries the measured
# values): packed_data_end s4 0x8B6BC / s4.debug 0x8C01E, DEBUG binds, so
# dac_banks = align_up(0x8C01E + 0xC000 + 0x8000) = align_up(0xA001E) = 0xA8000
# (bank $15; shared bank 0xB0000 = $16), sound_bank = 0xB8000 (bank $17). Room in
# the binding shape 114,658 B, of which 65,506 B sits above the reserve.
#
# Superseded, kept for the reader who finds the old numbers elsewhere: applied
# 2026-08-26 with RESERVE 0x4000 and no grace term — dac_banks 0x90000 (bank $12,
# shared 0x98000 = $13), sound_bank 0xA0000 (bank $14); see
# docs/superpowers/2026-08-26-rom-relayout-report.md.
#
# tools/bganim_room.py --gate (build.sh, post-sigil, both canonical shapes) enforces
# the rule: it FAILS naming the new anchor pair when the room under `dac_banks`
# drops below DATA_GROWTH_RESERVE — the remedy is to move BOTH anchors per the rule,
# never to shrink the reserve.
#
# ⚠ AN ANCHOR MOVE IS THE ONE aeon CHANGE THAT STILL CANNOT LAND ALONE, AND THAT IS
# A MECHANISM, NOT A CEREMONY. The owner ended the paired aeon+sigil freeze on
# 2026-09-02 ("CUT THE CEREMONY", empyrean docs/OVERSEER.md 2026-09-02T18:20:19Z) and
# aeon now certifies alone with its own gates — but an ISLAND's address is written in
# TWO places, an `[[anchor]]` here and a row in sigil's frozen table, and the build
# requires the two to agree.
#
# ~~SUPERSEDED (written 2026-09-04): "this file's own header sentence, 'the frozen tables
# are the placement authority, these anchors validate them', is literally true of the
# code, and it means an anchor here PLACES NOTHING."~~ Struck 2026-09-12 rather than
# deleted, because both halves were read as a rule elsewhere (tools/bganim_room.py
# repeated it). The quoted sentence is not in this file's header (the header calls the
# tables a MEASUREMENT cache), and at sigil 6884bfba the frozen tables place only the
# islands: every other section's base is packed from live-measured lengths. What
# survives is narrower and is stated in the next block.
#
# WHAT PLACES A SECTION. Read in sigil's source at 6884bfba (the revision the installed
# `sigil` reports), 2026-09-12. NOT re-measured by perturbation here; see REACH below.
#   * A SECTION THAT IS NOT AN ISLAND (all but a handful) is placed by the packing walk:
#     its position in the sequence is its row in this file's `order`; its alignment is
#     the `section_align` declaration sigil keeps for its head label; its base is the
#     running cursor past the previous section's LIVE-MEASURED length. Its frozen row,
#     if it has one, is only a provisional base: where the walk's first measurement
#     round pins it, and the threshold for the `[layout.provisional-drift]` warning.
#     The walk then re-measures at the packed bases until no length moves.
#   * AN ISLAND is held absolute at its FROZEN provisional base. A section is an island
#     when it opens the run (the vectors, row 0x0), when it is a phase bank (vma at or
#     above 0x8000 and unequal to its LMA: soundbankhead, head SoundTablesZ80_Head), or
#     when its frozen base EQUALS a declared `[[anchor]]` `at` (ObjCodeBase 0x10000,
#     Dac_Temp_Blip 0xA8000). Anchors are matched by ADDRESS, never by name. After the
#     resolve, `validate_placement` re-infers the islands from the layout (run head,
#     phase bank, or a gap over 0x400) and requires inferred == declared both ways.
#   * So for an island, the frozen row and this file's `at` must name the same address.
#     Moving either one alone fails the build (the two errors measured below); moving
#     both moves the island. The phase bank is held by its frozen row, and its anchor
#     here only validates it.
#
# SIGIL'S PROBE, 2026-09-11. Their measurement, with a binary built from a COPY of their
# checkout and the copy's table edited; recorded in sigil
# docs/superpowers/notes/2026-09-11-lst-source-digest.md at their 97aa2689 (an ancestor
# of their origin/master); NOT re-run here. On sonic4 plain: a comment byte, +2 on the
# first row, +2 on EndOfRom, a middle row deleted, +0x10000 on a middle row, and two
# rows' addresses swapped each still built, and each left the ROM byte-identical and
# the warning tally unchanged. Zeroing every row FAILED (`packed layout overlaps at its
# real bases, a run grew into a declared anchor`). That matches the source: none of the
# edits that built moved an island row. It does NOT show that no row edit can ever move
# a byte: the first-round pins could in principle steer a branch-relaxation fixpoint,
# and nobody has measured that.
#
# REACH, i.e. why aeon did not re-probe. `load_frozen_table` reads
# <CARGO_MANIFEST_DIR>/golden/offcanonical_sizes/<shape>.txt, a path fixed when the
# binary was COMPILED: the pin worktree the installed `sigil` was built in. `sigil build`
# has no flag or environment variable that points it at another copy. A probe therefore
# means editing that shared pin tree or building a second binary, and both belong to the
# sigil lane.
#
# MEASURED 2026-09-04 at the build, both directions (still consistent with the source
# above; the source bullet that stood here is superseded by the block above):
#   * ~~`true_bases_by_index` (crates/sigil-harness/src/native.rs) builds every ROM
#     section's provisional base from `profile.frozen_sizes` ... so a declared anchor can
#     only AUTHORIZE a section to stay at the address the frozen table already gives
#     it.~~ True of the provisional base and of the islands; silent on the fact that no
#     other section takes its base from the table.
#   * Declaring dac_banks/sound_bank at 0xA8000/0xB8000 with the tables unchanged:
#     `error: [map.undeclared-island] ROM section at 0x90000 is an ANCHOR_GAP-inferred
#     island but no [[anchor]] at = 0x90000 is declared` — the DAC bank did not move.
#   * Control, same tree: keep 0x90000/0xA0000 and add a third anchor at 0xA8000:
#     `error: [map.anchor-absent] declared anchor `control_probe_a8000` at 0xA8000 is
#     not an inferred island in this build` — nothing landed at the declared address.
#   * `sigil build` has no frozen-table override flag.
#
# So moving these two lines requires the matching rows (`Dac_Temp_Blip` and
# `SoundTablesZ80_Head`) to move in sigil's frozen tables for every sound-on shape
# (s4, s4_debug, config_a, lean; config_b is sound-off and unaffected) — hand it to
# the sigil lane. What the 09-02 cut changed
# is that a sigil refreeze is no longer a CERTIFICATION gate on an ordinary aeon
# landing; it did not, and could not, change this placement mechanism.
#
# WHAT BOUNDS HOW FAR THE BANKS CAN MOVE (from source, 2026-08-26):
#   * engine/sound/z80_sound_driver.emp `SndDrv_SetBank`: the bank id rides in the
#     8-bit `a` register and the 9th latch bit is written as a literal 0 ("all our
#     banks are < $100") -> bank id <= $FF -> bank LMA < 0x800000.
#   * `bankid()` masks $7F8000 (sigil-frontend-emp eval/builtins.rs) -> the same $FF.
#   * The cartridge address space ends at 0x3FFFFF -> bank id <= $7F, LMA <= 0x3F8000.
#   So the rule can move the banks anywhere up to 0x3F8000 - 0x10000. Re-derived
#   2026-09-04 at the applied anchors: the highest bank is `sound_bank` 0xB8000 =
#   bank $17 (23). Headroom to the driver's $FF cap = 232 windows = 7,602,176 B; to
#   the cartridge's $7F cap = 104 windows = 3,407,872 B. The ROM ends under 0x110000.
#
# The DAC sample banks. Native since K4 inc-5 Stage 2: games/sonic4/data/sound/
# dac_banks.emp embeds dac_blip_bank.bin @ dac_banks + dac_shared_bank.bin @
# dac_banks + 0x8000 as ONE section (head Dac_Temp_Blip, the shared bank reached
# via an intra-section `align $8000`), so only the section head is an island — this
# single anchor covers it (the shared bank is mid-section, not a separate island).
# Matched by ADDRESS, so the section rename is transparent.
[[anchor]]
name = "dac_banks"       # dac_banks.emp section head (Dac_Temp_Blip) — bank $15
at = 0xA8000
when = "sound_on"

[[anchor]]
name = "sound_bank"      # SoundTablesZ80_Head — the MT/SFX phase bank (vma $8000), bank $17
at = 0xB8000
vma = 0x8000
when = "sound_on"

# ── Holes (declared as data now; boot_data enforcement rides K2) ──
[[hole]]
after = "Z80_IdleProgram"   # the Z80 idle runs from the label to `at`; MEASURED 0x3C8..0x3F0
at = 0x3F0                   # post-hole AS data (PSG silence, post-DMA) resumes here (idle 0x3C8..0x3F0)
                             # ⚠ was 0x3FE, and the comment said $3d8..$3fe, from 2026-08-01
                             # (a7375682/K1) — both went stale when the layout moved twice
                             # underneath them (boot region +8, idle body 38->40 B) and
                             # NOTHING could contradict them: no check read a hole's
                             # interior until sigil's HOLE_INTERIOR_RESERVED, whose first
                             # contact with shipped data found this. Verified in demo.bin
                             # (the sound-off shape this hole gates on): 0x3D0 = 0xAF idle
                             # head, 0x3F8 = 0x9F post-hole PSG byte, and 0x3FE = 0xC0 —
                             # real data six bytes INSIDE the space this line reserved.
filled_by = "engine.z80_init"
when = "sound_off"
# NOTE: this `when` is load-bearing for a GUARD, not just for placement.
# engine.z80_init carries an ensure on Z80_IDLE_SIZE that therefore never
# evaluates in either shipped sonic4 shape -- see the ⚠ block at that ensure.
# Presence in this file is not liveness.

# ── Budgets (pack-time ceiling; the was-AS `if * > $20000 / error` guard) ──
# `cursor` is the head-label of the first section PAST the object bank (the data-region
# head): the bank and the data region pack contiguously and the data extends beyond the
# $20000 window, so the bank terminus is exactly where data begins. Its resolved LMA is
# the used-cursor — the map-owned successor to engine.inc's retired `__BUDGET_DATA` marker
# (K4 inc-6B).
[[budget]]
region = "object_bank"
ceiling = 0x20000
cursor = "DeformTable_Zero"
