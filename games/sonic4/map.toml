# banks, because the data region ran out at the `dac_banks` org anchor ($48000) and
# 132 KB + 140 KB of sprite data did not fit before it. The banks now sit AFTER the
# data region (see the BANK PLACEMENT RULE below), so the exile is retired: the two
# character-data sections precede `HeightMaps` (collision_data, which ends with the
# Sonic trio `Map_Sonic`/`DPLC_Sonic`/`Art_Sonic`). They go BEFORE collision_data,
# not after it, on purpose: `Art_Sonic` is the last packed blob before the banks and
# its on-disk embed length is what tools/bganim_room.py adds to its listing LMA to
# derive the packed-data end — a section with several embeds has no such instrument.
