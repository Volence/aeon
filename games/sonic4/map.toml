# Sonic-4 placement map — the DECLARED ROM placement contract (Parcel K1).
#
# Owns the reviewed placement facts the frozen tables used to bootstrap implicitly:
# the island ANCHORS, the boot_data HOLE (data; K2 enforces), the object-bank BUDGET,
# and the byte-emitting section ORDER (VALIDATED against the packer's derived order —
# R2; the map DRIVES order in K5, once the synthetic-named AS residual is gone).
# Consumed by the sigil chainer (crates/sigil-harness/src/native.rs); the frozen
# tables (golden/offcanonical_sizes/s4*.txt, config_*.txt) remain the per-label
# provisional-base MEASUREMENT cache the order-derivation sorts.
#
# Covers the four sonic4-rooted targets: s4, s4_debug (add CompressionSelfTest),
# config_a (adds Debug_MusicToggle / Sound_DebugMirror / CompressionSelfTest, sound+debug),
# config_b (sound-OFF: adds the Z80 idle Z80_IdleProgram / BootData_End). `when` gates the
# sound-conditional facts; the ORDER list is the union — each target is a subsequence.
#
# FAULT-HANDLER SHAPE SPLIT — ⚠ THE review-item-29 SPLIT DESCRIBED BELOW IS SUPERSEDED.
#
# WHAT IS TRUE NOW (crash-report ruling, owner, 2026-08-04): BOTH canonical shapes — s4
# (release) and s4_debug — carry the error_handler island (the vendored MDDBG blob) and its
# deb2 symbol table. Release is NOT stripped. `build.sh`'s own header says this ruling
# "SUPERSEDES the review-item-29 release strip"; see also build.sh's CRASH_REPORT guard and
# CLAUDE.md's shapes paragraph. `ReleaseFault` (release_fault.emp — loud-failure freeze) is
# now the **`lean` off-canonical profile's** handler: sigil's own port gates state that it
# "no longer appears in either canonical shape" and "is the lean shape's handler"
# (crates/sigil-cli/tests/vectors_port.rs, native_full_rom.rs).
#
# ⚠ NOT RE-VERIFIED HERE: what config_a / config_b place. They are off-canonical sigil
# profiles gated by their own goldens, `build.sh` speaks only for the two shapes it ships,
# and no one has checked them since the ruling. Do not infer them from the stale text below.
#
# ~~SUPERSEDED (review item 29 part 4 — the MDDBG strip): RELEASE targets (s4, config_b)
# place ReleaseFault and NOT the error_handler island; DEBUG targets (s4_debug, config_a)
# place BusError.. and NOT ReleaseFault.~~ Kept struck-through rather than deleted because
# the union-order fact below still depends on the two sections being mutually exclusive
# per target, and a reader needs to know WHICH claim was retired.
#
# STILL TRUE: both `ReleaseFault` and `BusError` sit in the union order consecutively, no
# single target carries both, so each target's derived order stays a subsequence.
# (`NullInterrupt` — the deleted tolerant `rte` — is gone from both.)
#
# Why this comment was wrong for so long: a superseded ruling inside a comment outlives
# every doc that recorded its revision, because nobody re-reads a comment to check whether
# the rule it cites still holds. Found 2026-08-22 by an agent working on an unrelated
# parcel, which is the only reason it surfaced at all.
#
# INVARIANT — THE FAULT-HANDLER ISLAND IS LAST: the error_handler island MUST remain the
# FINAL byte-emitting section in every shape that carries it. The vendored MD Debugger blob
# locates its deb2 symbol appendix through two PC-relative `lea` displacements BAKED INTO
# the opaque blob bytes, both pointing at `ErrorHandlerBlob + $F56` = one past the blob's
# last byte — i.e. the blob asserts `symbol table == blob end`. convsym appends the deb2
# table at `EndOfRom`, so anything placed between the blob and `EndOfRom` silently breaks
# runtime symbol resolution (the blob's `cmpi.w #$DEB2,(a1)+` reads the intruding bytes,
# fails, and every backtrace line prints `<unknown>`). NOTHING may be appended after the
# island: `Replay_OJZ_Fixture` therefore sits BEFORE `ReleaseFault`/`BusError`, not after.
# See the WARNING block at the top of engine/debug/error_handler.emp for the mechanism,
# and the hard build guard in sigil crates/sigil-harness/src/native.rs
# (`append_deb2_appendix`), which fails the build if this order ever drifts back.

fill = 0x00

# `Map_Tails` / `Map_Knuckles` sit WITH the character data again (ROM re-layout,
# 2026-08-26, owner ruling d-28-answered option 2). From C1 task 5 (Tails) and C4 task
# 9 (Knuckles) until this parcel both were EXILED to the ROM tail, past the sound
# banks, because the data region ran out at the `dac_banks` org anchor ($48000) and
# 132 KB + 140 KB of sprite data did not fit before it. The banks now sit AFTER the
# data region (see the BANK PLACEMENT RULE below), so the exile is retired: the two
# character-data sections precede `HeightMaps` (collision_data, which ends with the
# Sonic trio `Map_Sonic`/`DPLC_Sonic`/`Art_Sonic`). They go BEFORE collision_data,
# not after it, on purpose: `Art_Sonic` is the last packed blob before the banks and
# its on-disk embed length is what tools/bganim_room.py adds to its listing LMA to
# derive the packed-data end — a section with several embeds has no such instrument.
#
# ── Order (byte-emitting section head-labels / module-ids, canonical union order).
#    Root array — MUST precede the `[[table]]` sections below (TOML scoping). Each
#    target's derived byte-emitting order must be a SUBSEQUENCE of this list; a
#    derivation change fails loud (R2 validate). Zero-byte markers (e.g. __BUDGET_DATA)
#    are excluded — their tie-position is byte-neutral and shape-varying. ──
order = [
  "Vectors", "GameHeader", "EntryPoint", "BootData",
  "Z80_IdleProgram", "BootData_PostBlob",
  "VDP_Shadow_Init", "Init_DMA_Queue", "Init_SpriteTable", "VBlank_Handler",
  "HBlank_Install", "Read_Controllers", "GameLoop", "Input_Tick", "S4LZ_DecompressDict",
  "ZX0R_Decompress", "GetSineCosine", "Perform_DPLC", "InitObjectRAM",
  "InitSpriteSystem", "AnimateSprite", "TouchResponse", "RingBuffer_Add",
  "Collected_Init", "PopulateSpawnedPieceCount", "Load_Object", "Plane_Buffer_Reset",
  "Tile_Cache_GetTile", "Collision_GetType", "Collision_ProbeDown", "Debug_MusicToggle",
  "Section_Init", "Camera_Init", "Parallax_Init", "Raster_Install", "Palette_LoadPal", "Effects_ResolveParallax", "Effects_InstallPreset", "Level_LoadArt",
  "PageIn_Process", "PageCache_Init", "BG_Init", "BgAnim_Init", "CompressionSelfTest", "Sound_PostByte",
  "Sound_DebugMirror", "ObjCodeBase", "Player_Init", "PState_Ground",
  "PState_Air", "PState_Spindash", "PState_Fly", "PState_Glide", "Climb_WallDist",
  # Sonic's insta-shield (player/player_instashield.emp) — beside the other
  # characters' ability states and ahead of the CharDef records that point at it.
  # ONE section for the whole feature: the hook, the flash object that closes its
  # attack window, and the flash's 52 tiles of art / mappings / DPLC / script.
  "Ability_InstaShield",
  "CharDef_Sonic", "CharDef_Tails", "CharDef_Knuckles", "CharacterDefs",
  "TailsAppendage_Refresh",
  "DustPuff_Spawn", "Dust_Tick",
  "RingSparkle_Spawn",
  # The ring-collect sparkle (objects/ring_sparkle.emp): the dust puff's twin, placed
  # right after the dust objects. Self-contained — its 192 B of mappings/script/art
  # ride in this section (see the module header for why it is not split like the dust).
  "TestStatic_Main",
  "TestAnimated", "TestPlayer", "TestEnemy_Init", "TestSolid_Init",
  "TestParticle", "TestEmitter", "TestChildPart", "TestStressEmitter",
  "TestChurnObj", "ObjDef_PathSwap",
  # Scanline-P1 Task 9: `DeformTable_Zero` is still the head of the OJZ parallax block and
  # still the object-bank budget `cursor` below — but the section behind it is now
  # `scene_registry` (data/effects/scene_registry.emp), not the deleted
  # `parallax_configs` (data/parallax/configs.emp). The block's CONTENTS are unchanged:
  # the six deform tables interleaved with the twenty records in the shipped order, now
  # lowered from the authored scenes instead of hand-written headers. The two temporary
  # `SceneOut_*` entries Task 6 added are gone with the prefixes.
  "DeformTable_Zero",
  # The editor-scene block (`ojz_effects_editor_act1`, generated by tools/effects_gen.py
  # from Aurora's saved scenes) sits HERE, immediately after the hand scene registry it
  # mirrors and after the object-bank budget cursor above, so the cursor keeps meaning
  # "the first section past the bank". The row is keyed by SECTION NAME (sigil
  # SECTION-ROW, 2026-08-26: `"section:<name>"` resolves to the section's head label at
  # placement) because this block's head label is CONTENT-DERIVED — whatever the generator
  # emits first (today the section-0 binding table `EditorSceneBinding_OJZ_Act1_Sec0`;
  # a deform table would land ahead of it the moment a scene attaches one). A label row
  # here would rot with content; the name row does not. A zero-byte block (no scenes
  # saved) is accepted and inert under this row. History: the slot was held row-less
  # until Aurora's first saved scene (ojz_act1_start, 2026-08-26) made it emit; the interim
  # label row landed at aeon 0e34408d and was replaced by this spelling the same night.
  "section:ojz_effects_editor_act1",
