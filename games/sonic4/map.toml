  "OJZ_Sec0_TypeTable", "OJZ_Act_Pool_Page0", "OJZ_Act1_Descriptor", "OJZ_Sec0_Blocks", "OJZ_Sec0_LocalMap", "OJZ_Palette",
  "BgAnim_Table", "Map_TestObj", "Map_DustSpindash",
  "Ani_Sonic", "Ani_Tails", "Ani_Knuckles", "Ani_Particle", "Ani_DustSpindash",
  # Character data (un-exiled 2026-08-26, see above), then collision_data — the LAST
  # data section: its tail `Art_Sonic` is the packed-data end the bank rule measures.
  "Map_Tails",
  "Map_Knuckles",
  "HeightMaps",
  # ── The Z80 banks: AFTER the data region, at the rule-derived bank-aligned LMAs ──
  "Dac_Temp_Blip", "SoundTablesZ80_Head",
  "Song_MovingTrucks", "Sfx_33",
  # ── The tail: the two test game states, the replay fixture, the fault island ──
  "GameState_ObjectTest_Init", "GameState_OJZScroll_Init",
  "__align$games.sonic4.replay_fixture$0", "Replay_OJZ_Fixture",
  "ReleaseFault", "BusError", "EndOfRom",
