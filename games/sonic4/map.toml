# ── Order (byte-emitting section head-labels / module-ids, canonical union order).
#    Root array — MUST precede the `[[table]]` sections below (TOML scoping). Each
#    target's derived byte-emitting order must be a SUBSEQUENCE of this list; a
#    derivation change fails loud (R2 validate). Zero-byte markers (e.g. __BUDGET_DATA)
