# Sonic-4 placement map — the DECLARED ROM placement contract (Parcel K1).
#
# Owns the reviewed placement facts the frozen tables used to bootstrap implicitly:
# the island ANCHORS, the boot_data HOLE (data; K2 enforces), the object-bank BUDGET,
# and the byte-emitting section ORDER (VALIDATED against the packer's derived order —
# R2; the map DRIVES order in K5, once the synthetic-named AS residual is gone).
# Consumed by the sigil chainer (crates/sigil-harness/src/native.rs); the frozen
# tables (golden/offcanonical_sizes/s4*.txt, config_*.txt) remain the per-label
# provisional-base MEASUREMENT cache the order-derivation sorts.
#
# Covers the four sonic4-rooted targets: s4, s4_debug (add CompressionSelfTest),
# config_a (adds Debug_MusicToggle / Sound_DebugMirror / CompressionSelfTest, sound+debug),
# config_b (sound-OFF: adds the Z80 idle Z80_IdleProgram / BootData_End). `when` gates the
# sound-conditional facts; the ORDER list is the union — each target is a subsequence.
#
# FAULT-HANDLER SHAPE SPLIT (review item 29 part 4 — the MDDBG strip): RELEASE targets
# (s4, config_b) place ReleaseFault (release_fault.emp — loud-failure freeze) and NOT the
# error_handler island; DEBUG targets (s4_debug, config_a) place BusError.. (error_handler.emp,
# the vendored MDDBG blob) and NOT ReleaseFault. Both `ReleaseFault` and `BusError` sit in the
# union order consecutively — no single target carries both, so each target's derived order
# stays a subsequence. (`NullInterrupt` — the deleted tolerant `rte` — is gone from both.)
#
# INVARIANT — THE FAULT-HANDLER ISLAND IS LAST: the error_handler island MUST remain the
# FINAL byte-emitting section in every shape that carries it. The vendored MD Debugger blob
# locates its deb2 symbol appendix through two PC-relative `lea` displacements BAKED INTO
# the opaque blob bytes, both pointing at `ErrorHandlerBlob + $F56` = one past the blob's
# last byte — i.e. the blob asserts `symbol table == blob end`. convsym appends the deb2
# table at `EndOfRom`, so anything placed between the blob and `EndOfRom` silently breaks
# runtime symbol resolution (the blob's `cmpi.w #$DEB2,(a1)+` reads the intruding bytes,
# fails, and every backtrace line prints `<unknown>`). NOTHING may be appended after the
# island: `Replay_OJZ_Fixture` therefore sits BEFORE `ReleaseFault`/`BusError`, not after.
# See the WARNING block at the top of engine/debug/error_handler.emp for the mechanism,
# and the hard build guard in sigil crates/sigil-harness/src/native.rs
# (`append_deb2_appendix`), which fails the build if this order ever drifts back.

fill = 0x00

# WHY `Map_Tails` IS NOT NEXT TO `HeightMaps` (character-dispatch C1 task 5): it
# belongs there — the Tails mappings/DPLC/art are the exact peer of the Sonic trio
# that ends the `collision_data` section — and it does not FIT there. The data
# region runs out at the `dac_banks` org anchor ($48000, a Z80 SetBank latch), and
# `Art_Sonic` already ends at $4277E: 22,658 bytes of headroom against the 132 KB
# the Tails body + appendage need. So the bulk sprite data is exiled to the ROM
# tail, after the sound banks, where growth is unbounded; the 234-byte
# `Ani_Tails` script table DOES fit and stays with `Ani_Sonic` where it belongs.
# This exile is a ROM-ADDRESS workaround, not a design one — module ownership and
# file layout are unchanged — and it is exactly what the parked "banks late, data
# unbounded" ROM re-layout parcel exists to retire. Undo it when that lands.
#
# ── Order (byte-emitting section head-labels / module-ids, canonical union order).
#    Root array — MUST precede the `[[table]]` sections below (TOML scoping). Each
#    target's derived byte-emitting order must be a SUBSEQUENCE of this list; a
#    derivation change fails loud (R2 validate). Zero-byte markers (e.g. __BUDGET_DATA)
#    are excluded — their tie-position is byte-neutral and shape-varying. ──
order = [
  "Vectors", "GameHeader", "EntryPoint", "BootData",
  "Z80_IdleProgram", "BootData_PostBlob",
  "VDP_Shadow_Init", "Init_DMA_Queue", "Init_SpriteTable", "VBlank_Handler",
  "HBlank_Install", "Read_Controllers", "GameLoop", "Input_Tick", "S4LZ_DecompressDict",
  "ZX0R_Decompress", "GetSineCosine", "Perform_DPLC", "InitObjectRAM",
  "InitSpriteSystem", "AnimateSprite", "TouchResponse", "RingBuffer_Add",
  "Collected_Init", "PopulateSpawnedPieceCount", "Load_Object", "Plane_Buffer_Reset",
  "Tile_Cache_GetTile", "Collision_GetType", "Collision_ProbeDown", "Debug_MusicToggle",
  "Section_Init", "Camera_Init", "Parallax_Init", "Raster_Install", "Palette_LoadSection", "Level_LoadArt",
  "PageIn_Process", "PageCache_Init", "BG_Init", "BgAnim_Init", "CompressionSelfTest", "Sound_PostByte",
  "Sound_DebugMirror", "ObjCodeBase", "Player_Init", "PState_Ground",
  "PState_Air", "PState_Spindash", "PState_Fly",
  "CharDef_Sonic", "CharDef_Tails", "CharDef_Knuckles", "CharacterDefs",
  "TailsAppendage_Refresh",
  "DustPuff_Spawn", "Dust_Tick",
  "TestStatic_Main",
  "TestAnimated", "TestPlayer", "TestEnemy_Init", "TestSolid_Init",
  "TestParticle", "TestEmitter", "TestChildPart", "TestStressEmitter",
  "TestChurnObj", "ObjDef_PathSwap", "DeformTable_Zero", "ObjDef_Static",
  "OJZ_Sec0_TypeTable", "OJZ_Act_Pool_Page0", "OJZ_Act1_Descriptor", "OJZ_Sec0_Blocks", "OJZ_Sec0_LocalMap", "OJZ_Palette",
  "BgAnim_Table", "Map_TestObj", "Map_DustSpindash",
  "Ani_Sonic", "Ani_Tails", "Ani_Knuckles", "Ani_Particle", "Ani_DustSpindash", "HeightMaps", "Dac_Temp_Blip", "SoundTablesZ80_Head",
  "Song_MovingTrucks", "Sfx_33",
  "Map_Tails",
  "Map_Knuckles",
  "GameState_ObjectTest_Init", "GameState_OJZScroll_Init",
  "__align$games.sonic4.replay_fixture$0", "Replay_OJZ_Fixture",
  "ReleaseFault", "BusError", "EndOfRom",
]

# ── Region geometry (this map is the SOLE owner — sigil.map.toml retired in K5) ──
[[region]]
name = "rom"
lma_base = 0
size = 0x400000
kind = "rom"

[[region]]
name = "object_bank"
lma_base = 0x10000
size = 0x10000
kind = "object_bank"

[[region]]
name = "z80_moving_trucks_bank"
lma_base = 0x60000
size = 0x8000
kind = "z80_bank"
vma_base = 0x8000

# ── Island anchors (replaces the ANCHOR_GAP inference for the declared ones; the
#    inference stays as the [map.undeclared-island] lint) ──
[[anchor]]
name = "boot_head"       # the run head (vectors + header), label-less
at = 0x0

[[anchor]]
name = "object_bank"     # ObjCodeBase — the 64KB object code bank
at = 0x10000

# The DAC sample banks — fixed LMAs (Z80 SetBank latches). Native since K4 inc-5
# Stage 2: games/sonic4/data/sound/dac_banks.emp embeds dac_blip_bank.bin @ $48000
# + dac_shared_bank.bin @ $50000 as ONE section (head Dac_Temp_Blip @ $48000, the
# shared bank reached via an intra-section `align $8000`), so only the section head
# is an island — this single anchor covers it (the shared bank is mid-section, not a
# separate island). Matched by ADDRESS ($48000), so the section rename is transparent.
[[anchor]]
name = "dac_banks"       # dac_banks.emp section head (Dac_Temp_Blip) — bank $48000
at = 0x48000
when = "sound_on"

[[anchor]]
name = "sound_bank"      # SoundTablesZ80_Head — the MT/SFX phase bank (vma $8000)
at = 0x58000
vma = 0x8000
when = "sound_on"

# ── Holes (declared as data now; boot_data enforcement rides K2) ──
[[hole]]
after = "Z80_IdleProgram"   # the 38-byte Z80 idle occupies $3d8..$3fe
at = 0x3FE                   # post-hole AS data (PSG silence, post-DMA) resumes here
filled_by = "engine.z80_init"
when = "sound_off"

# ── Budgets (pack-time ceiling; the was-AS `if * > $20000 / error` guard) ──
# `cursor` is the head-label of the first section PAST the object bank (the data-region
# head): the bank and the data region pack contiguously and the data extends beyond the
# $20000 window, so the bank terminus is exactly where data begins. Its resolved LMA is
# the used-cursor — the map-owned successor to engine.inc's retired `__BUDGET_DATA` marker
# (K4 inc-6B).
[[budget]]
region = "object_bank"
ceiling = 0x20000
cursor = "DeformTable_Zero"
