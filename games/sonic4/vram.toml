[[region]]
name = "debug_preset_readout"
owner = "games.sonic4.ojz_scroll_test"
kind = "window"
base = 957
tiles = 2
lifetime = "mode"
const = "VRAM_DEBUG_PRESET_READOUT"
# The effects lab's PRESET cells, MOVED here from 1022-1023 by the 2026-09-05 chord
# consolidation. Two 8x8 cells, one System object each (they are single cells, not a
# multi-cell piece, so they need no contiguity beyond their own order):
#
#   +0   the SECTION whose EffectsPreset is installed, one decimal digit
#   +1   the VERDICT glyph — bar (nothing bound) / X (bound but off screen here) /
#        diamond (live) / arrow (its own background scene; move to see it) / blank
#        (the lab cursor is not on a preset entry at all)
#
# WHY THEY MOVED. The three lab chords collapsed into ONE list walked by
# START+LEFT/RIGHT, and a single list wants a single NAME rather than a cursor
# number. The name is four cells wide (the VDP's maximum sprite-piece width), and
# the map's only free four-tile run was already spent on `debug_raster_tag`. So the
# retiring two-digit cursor readout's own run — 1020-1023, four contiguous tiles —
# became the name tag (`debug_lab_name` below) and these two cells came here, into
# the last [[free]] run, leaving 959 free.
#
# RESERVED IN EVERY SHAPE, WRITTEN ONLY IN DEBUG, for the reason `debug_lab_name`
# below records at length.

[[free]]
base = 959
tiles = 1
# the page-quantised carve's remainder — future sprite art. It was 957-959 (3
# tiles) until the 2026-09-05 chord consolidation moved the preset readout's two
# cells into 957-958; this is what is left of it, and it is the map's LAST free run.

