# games/sonic4/vram.toml — the DECLARED VRAM placement contract (peer of map.toml).
# Spec: docs/superpowers/specs/2026-08-11-vram-linker-design.md §4.1/§5.
# T0: every region is PINNED (base required); the T1 solver introduces floating.
# Sizes in tiles (1 tile = 32 bytes). Consumed by tools/gen_vram_map.py, which
# rewrites the GENERATED block in config/constants.emp, tools/vram_map.py, and
# docs/generated/vram-map-sonic4.md. Full coverage of tiles 0..2047 is enforced:
# every tile is a region or a declared [[free]] run.

[[region]]
name = "fg_art_pool"
owner = "engine.level.page_cache"
kind = "arena"
base = 0
tiles = 768                      # 960 -> 896 (the dust carve) -> 768 (EFFECTS-W1
quantum = 64                     # item 0, Option P: the spare nametable below).
lifetime = "act"                 # Both cuts are safe for the SAME post-prep-parcel
authority = "engine-endtiles:POOL_TILE_CEILING"  # reason: no RAM moves, no fixture
                                 # re-stamp (PAGE_FRAMES_MAX sizes the arrays; every
                                 # region from 896 up keeps its base).
                                 # AUTHORITY stays engine-side; the generated block
                                 # cross-checks equality, so forgetting the engine
                                 # constant fails the build by name.
                                 # The FLOOR is 640 tiles / 10 frames until C4-3
                                 # (the famine capacity fix) lands: below that an act
                                 # runs with granted near floor and tight-cache mode
                                 # has an open defect (the STRESS_EVICT famine).

[[region]]
name = "spare_nametable"
owner = "engine.system.boot"
kind = "plane"
base = 768                       # byte $6000 — a multiple of $2000, so this run is
tiles = 128                      # simultaneously a legal Plane A base (reg $02 =
lifetime = "boot"                # $18), Plane B base (reg $04 = $03) and Window base
                                 # (reg $03 = $18). It is the ONLY $2000-aligned run
                                 # in this map that could be freed at a price anyone
                                 # would pay, and the pool's quantum = 64 is what
                                 # lands it exactly on $6000 rather than $6800.
#
# NO `register` FIELD YET, DELIBERATELY. Nothing points a VDP base register here;
# the consumer parcel (EFFECTS-W1 items 10c / 11b) adds `register = "vdp:0x0N"` when
# it wires one, and that is the parcel where the alignment decision is actually made.
#
# WHY A NAMED REGION AND NOT A [[free]] RUN. An unnamed run is exactly how the BG
# band reserve reached zero (docs/BUGS.md TOOL-01, the precedent the bg_region
# comment below cites): free space with no owner gets spent by the next person who
# needs tiles and does not know what it was for. Naming it reserves the ADDRESS,
# which is the scarce thing here — spare tiles are not scarce, spare $2000-aligned
# tiles are (all eight legal plane bases were occupied before this cut).
#
# ⚠ gen_vram_map.py does NOT check base-register alignment (its checks are bounds,
# coverage, overlap, quantum, reserve, authority). A misaligned nametable region
# passes it with exit 0. The rider that teaches it the granule table is booked in
# docs/DEFERRED_WORK.md and rides the parcel that consumes this region.

[[region]]
name = "dust_puff"
owner = "games.sonic4.dust_puff"
kind = "window"
base = 896
tiles = 16
lifetime = "act"
const = "VRAM_DUST_PUFF"
# resident block: concurrent puffs sit on DIFFERENT anim frames, so all four
# frames must be live at once, addressed 0/4/8/$C from this base (dust spec §4)

[[region]]
name = "dust_spindash"
owner = "games.sonic4.dust_spindash"
kind = "window"
base = 912
tiles = 12
lifetime = "act"
const = "VRAM_DUST_SPINDASH"
# the charge dust's DPLC target — deliberately NOT shared with the puff block
# (S3K shares one window and has a visible lingering-puff artifact; dust spec §4.1)

[[region]]
name = "ring_sparkle"
owner = "games.sonic4.ring_sparkle"
kind = "window"
base = 924
tiles = 4
lifetime = "act"
const = "VRAM_RING_SPARKLE"
# the ring-collect sparkle: ONE 2x2 piece (donor tiles 10-13) drawn in four flip
# orientations by its mappings, so four tiles serve all four frames. RESIDENT
# for the act, like dust_puff: concurrent sparkles sit on different frames, so
# the block is never streamed (docs/superpowers/notes/2026-08-26-ring-sparkle-design.md)

[[region]]
name = "insta_shield"
owner = "games.sonic4.insta_shield"
kind = "window"
base = 928
tiles = 29
lifetime = "act"
const = "VRAM_INSTA_SHIELD"
# Sonic's insta-shield flash: STREAMED, not resident. The sheet is 52 tiles (two
# 23/29-tile blocks the donor DPLC pages between), which no free run can hold —
# the only one big enough would have to come out of fg_art_pool, whose ceiling is
# POOL_TILE_CEILING. (This comment used to add "which moves RAM"; that has been
# FALSE since the 2026-08-11 prep parcel split PAGE_FRAMES from PAGE_FRAMES_MAX —
# see the constant's own comment. What the pool actually costs is page-frames.)
# 29 = the peak DPLC frame, and the .emp
# re-derives it from the blob rather than trusting this number
# (docs/superpowers/notes/2026-08-26-instashield-design.md §2.6).

[[free]]
base = 957
tiles = 3
# the page-quantised carve's remainder — future sprite art

[[region]]
name = "character_window"
owner = "games.sonic4.player"
kind = "window"
base = 960
tiles = 32
lifetime = "act"
const = "VRAM_TEST_SONIC"
# PINNED, deliberately: the base is baked into the player's art_tile word,
# which the replay hash covers — MOVING it re-stamps both fixtures. GROWING it
# is not moving it (spec §4.1): raise `tiles` with the base held.

[[region]]
name = "test_obj"
owner = "games.sonic4.test_objects"
