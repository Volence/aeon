[[region]]
name = "debug_lab_name"
owner = "games.sonic4.ojz_scroll_test"
kind = "window"
base = 1020
tiles = 4
lifetime = "mode"
const = "VRAM_DEBUG_LAB_NAME"
# The effects lab's ENTRY NAME TAG: four 8x8 cells forming ONE 4x1 VDP sprite piece,
# so the whole tag costs one System object slot instead of four. It spells the name
# of the entry the ONE lab list's cursor is standing on — DFLT / HAZE / BAND / SWAP /
# WATR / ... — one four-letter word per entry, whatever KIND of entry it is.
#
# THIS RUN USED TO BE THE TWO-DIGIT CURSOR READOUT plus the preset digit and verdict
# (`debug_readout`, retired 2026-09-05). The owner's ask was "why are there 3 ways to
# do things now?" and the answer was one list, walked by START+LEFT/RIGHT, with the
# readout NAMING each entry as you pass it. A name beats a number for the thing he
# actually does with it — relaying what he is looking at — so the digits went and the
# four tiles they sat in became the name. The preset digit and verdict moved to
# `debug_preset_readout` (957-958), the map's last free run.
#
# THE FOUR TILES MUST STAY CONTIGUOUS AND IN THIS ORDER: a multi-cell sprite piece
# reads consecutive VRAM tiles from its base, so splitting this run would not merely
# move the tag, it would draw four unrelated tiles as a word. Four is the VDP's
# MAXIMUM piece width — that is what fixes lab entry names at four characters, and it
# is a hardware limit, not a taste call. A fifth letter costs a second object, a
# second System slot and a second VRAM run, and the map has one free tile left.
#
# RESERVED IN EVERY SHAPE, WRITTEN ONLY IN DEBUG — a VRAM reservation is not a ROM
# byte, and declaring it in all shapes is what keeps this file the single placement
# authority (the alternative, a shape-conditional region, would make the map mean two
# different things and gen_vram_map.py checks adjacency across the whole 0..2047 span).
#
# Only the SELECTED glyphs are ever resident: the 26-letter alphabet stays in ROM and
# is DMA'd one cell at a time, which is why a 26-tile sheet does not have to fit here.
# THE MAP HAS ONE FREE TILE LEFT (959). A fourth tag, or a fifth letter, has to come
# out of a region.

[[region]]
name = "bg_region"
owner = "engine.bg"
kind = "arena"
base = 1024
tiles = 400                      # 448 -> 400: the top 48 tiles became the
band_reserve = 80                # `waterline_strips` region below (EFFECTS-W1
                                 # item 9d). Reserve 128 -> 80 in the SAME edit
                                 # so the STATIC budget (tiles - reserve) stays
                                 # 320 — the 48 came out of the RESERVE, not out
                                 # of the shipped background. Verify with
                                 # `python3 tools/perspective_floor_gen.py --report`,
                                 # which prints capacity / static budget / reserve.
                                 # tiles withheld from the STATIC BG importer
lifetime = "act"                 # (tools/png_to_bg_override.py) so a BgAnim band
authority = ["engine-tiles:BG_TILE_CAPACITY", "engine-bytebase:BG_TILE_BASE_VRAM"]
# can be inserted later. `tiles` is a hard VRAM boundary ($8000..$B7FF; the SAT
# sits at $B800) — the reserve is the ANIMATION-vs-DETAIL dial inside it, and it
# is the owner's number to set at the next art pass.
#
# WHY HERE AND NOT A --max-tiles FLAG: a flag is forgotten on the next import,
# and that is precisely how the reserve reached zero. The 2026-07-21 import
# packed to 448/448 because nothing pushed back, destroying two bands (32x4 and
# 16x4 = 192 animated slots) that cannot now be re-authored at any size, 1x1
# included. See docs/BUGS.md TOOL-01.
#
# HOW TO SET IT: raise this number, then regenerate (the command in the header
# comment above). tools/test_gen_vram_map.py::test_generated_artifacts_are_in_sync
# fails the build if you edit this file and skip the regenerate.
#
# SIZING NOTE (measured, not inferred): the destroyed configuration was NOT
# "192 reserved of 448". The blob was 340 tiles total — 192 animated slots at
# the FRONT plus 148 purely-static ones, with 108 slots simply unused. A band's
# tiles ARE the front of `tiles` (its phase-0 IS the static art there; see
# inject_editor_bg.py validate_band_coherence), so animated slots are a subset
# of the blob, never an addition to it. Reproducing that shape means
# band_reserve = 192 with the static import held to 256.
#
# WHY 128 AND NOT 192 (overseer call, 2026-08-22, delegated by the owner).
# The owner set the constraint as a LOOK TEST, not a figure — "as long as it
# still looks slightly reasonable we can do whatever's best to reserve for
# animation" — so this number is chosen to be approached from the GENEROUS side
# and tightened, never overshot. 128 is one full-size animated band (the
# destroyed art's larger band was exactly 32x4 = 128), leaving 320 of 448 for
# static art. 192 would reproduce both original bands but asks the next
# generated art to nearly HALVE its unique-tile count against today's 448, and
# discovering that as ugly art costs more than moving a number: tightening is an
# edit, overshooting is the owner losing confidence in the tool.
#
# ⚠ THE PARAGRAPH BELOW WAS WRITTEN BEFORE THE 2026-08-26 RE-IMPORT AND ITS LAST
# TWO SENTENCES ARE NOW FALSE. `e192062e` regenerated the background from aurora's
# simplified source and the blob went 448 -> 320 tiles, so this setting DID get
# spent: the full 128-tile reserve is unresident today (measured from the baked
# artifact by tools/test_bg_tile_budget.py::TestBakedBlobOccupancy, not restated
# here). Band INSERTION is possible now; it was impossible when this was written.
# Kept rather than deleted because the REASONING is still correct and the reserve
# is still the dial — only the "frees nothing today" verdict expired.
#
# THIS SETTING BINDS THE *NEXT* IMPORT AND FREES NOTHING TODAY. The importer
# REFUSES above the budget; it cannot re-quantise art downward, and no lossy
# path exists (perceptual tile merging was ruled out of scope — it exists only
# to salvage art that is being replaced). The shipped 448-tile blob is unaffected
# because inject_editor_bg.py:200 gates the FINAL blob on BG_TILE_CAPACITY, not
# on this budget. So Aurora's band INSERTION stays impossible until an art-side
# pass; promotion (convert existing static tiles, tiles.length unchanged) remains
# the working route.
#
# THE LOOK TEST HAPPENS FOR FREE, WHICH IS WHY NOBODY WAS ASKED FOR A NUMBER.
# The owner generates this art himself with a constrained generator, so the
# budget is simply an input next time and he sees the result on screen with no
# extra machinery. The evidence arrives at exactly the moment the decision
# becomes answerable. Re-tune this line then — it is one edit plus a regenerate.
#
# HELD AT 128 THROUGH THE PERSPECTIVE FLOOR (2026-09-03), and the near miss is
# worth recording because it is the reason the number did not move.
#
# The floor placeholder (tools/perspective_floor_gen.py) repaints plane cell rows
# 48..63. Rows 48..55 repeated VERBATIM at 56..63, so 123 of that band's tiles
# were referenced by no other row and come back when it is overwritten. The floor
# was tuned until it fits inside them:
#
#   unique tiles the floor needs            121
#   recycled from the band's own freed slots 121   (123 free, 2 left stranded)
#   appended                                   0
#   blob                              320 -> 320   -> this reserve is UNTOUCHED
#
# A FIRST CUT SPENT 58 OF THESE TILES AND WAS BACKED OUT, and not because of this
# region: 58 tiles is 1,856 B of ROM, which pushed `Art_Sonic`'s end past the
# DATA_GROWTH_RESERVE under `dac_banks` and failed tools/bganim_room.py on the
# DEBUG shape. At the time master's margin there was 252 B (room 16,636 B against a
# 16,384 B reserve) — two orders of magnitude tighter than this VRAM reserve.
#
# ⚠ THAT ROM MARGIN IS NO LONGER THE CONSTRAINT (second ROM re-layout, 2026-09-04).
# The same growth that back-out was avoiding kept coming and the gate did fire, 30 B
# under; the banks moved to 0xA8000 / 0xB8000 and the reserve went 0x4000 -> 0xC000
# with a new 0x8000 grace term. Measured on the DEBUG (binding) shape at that
# landing: room 114,658 B, of which **65,506 B sits above the reserve**. So the 58
# tiles this note records as unaffordable now cost 1.6 % of the available margin, and
# the back-out reason has expired. See docs/DEFERRED_WORK.md, the perspective-floor
# entry, and docs/superpowers/2026-09-04-rom-relayout-more-room-report.md.
#
# So: 128 still buys the full 32x4 band it was sized for. Anyone spending it should
# still run tools/bganim_room.py — it is the only instrument that answers — but the
# ROM room is no longer the tighter of the two.

[[region]]
name = "waterline_strips"
owner = "engine.bg_anim"
kind = "window"
base = 1424
tiles = 48
lifetime = "act"
authority = "engine-bytebase:VRAM_WATERLINE_STRIPS"
# ENGINE-OWNED, so the authority is engine-side and not a game `const =` line: the DMA that
# fills this run is Waterline_Art_Update in engine/level/bg_anim.emp, which cannot see a
# game constant. Same shape as `sprite_table` and `hscroll_table` above — the engine names
# the byte address, this file cross-checks it, and both games declare the region so one
# address means one thing in both maps.
# EFFECTS-W1 item 9d — the Hydrocity waterline's ART half: the fixed VRAM run
# that Waterline_Art_Update (engine/level/bg_anim.emp) DMAs its row-gathered
# strips into every frame the perspective quantity changes. S3K writes tiles
# $2DC/$2F4 the same way (sonic3k.asm:53981) and never touches the nametable.
#
# WHERE THESE 48 CAME FROM, because the answer is the owner's dial and not spare
# space: `bg_region` above went 448 -> 400 and its `band_reserve` went 128 -> 80
# in the same edit, so the STATIC importer budget (tiles - reserve) is unchanged
# at 320 and the shipped background blob (320 tiles, measured by
# tools/test_bg_tile_budget.py::TestBakedBlobOccupancy) is untouched. The 48
# came out of the 128 unresident reserve tiles; 80 of them remain reserved for a
# BgAnim band. The owner's "don't forget the hydrocity thing" (2026-09-04) is the
# word that spends them.
#
# ⚠ 48 IS THE OWNER-SANCTIONED SPEND, NOT THE DERIVED NEED, AND THE TWO DIFFER.
# The strip geometry is fully determined by the band height H:
#
#     tiles = 2 strips x 2 tile-columns x (H / 8 rows-per-tile) = H / 2
#
#   H (= 1 << brm_hshift)   8    16    32    64   [96]   128
#   tiles                   4     8    16    32   [48]    64
#
# S3K's waterline is H = 96 and that is where the booking's "48 tiles (two 16x96
# strips)" comes from. `band_remap.brm_hshift` consumes H as `1 << shift`, so 96
# is not a height this engine can NAME — the same fact parcel 9b measured for the
# ladder ("S3K's H = 96 is also not a power of two"). The art half inherits it.
# TODAY'S SHIPPED H IS 16 (Scene_OJZ_Underwater's `SceneRemap.Ladder(.., 101, 4)`),
# so 8 of these 48 tiles carry art and the region's own ceiling is H = 64.
# Raising the ladder to H = 32 or H = 64 therefore needs NO further VRAM
# negotiation; H = 128 would need 64 tiles and a second one.
#
# WHY A NAMED REGION AND NOT SLACK LEFT INSIDE `bg_region`: the reason that region's
# own comment gives at length (docs/BUGS.md TOOL-01) — unowned free space is spent
# by the next person who needs tiles and does not know what it was for. The address
# is the thing being reserved.

