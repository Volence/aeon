kind = "window"
base = 1000
tiles = 16
lifetime = "act"
authority = "sigil-D:VRAM_RING_PLACEHOLDER"   # -D define, native.rs; T1 feeds it
                                              # from this file. T0: soft-checked.

[[region]]
