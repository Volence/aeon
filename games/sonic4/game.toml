# A sigil negative-probe fixture the tree carries, never a build root.
# module_roots.rs:180 (SIGIL_PROBE_FIXTURES).
[[gate]]
modules = "games.sonic4.sigil_objroutine_probe"
place_in = { shapes = [] }

